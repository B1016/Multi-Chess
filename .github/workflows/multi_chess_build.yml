          @Composable
          fun MultiChessAppScreen() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var activeTab by remember { mutableStateOf(0) } // 0 = Host, 1 = Play
              var endpoint by remember { mutableStateOf(NetworkAddressHelper.findBestLanEndpoint()) }

              // Host state
              var hostRoomTitle by remember { mutableStateOf("Arena Match") }
              var isHostingRoom by remember { mutableStateOf(false) }
              var isScanningLan by remember { mutableStateOf(false) }
              var statusBanner by remember { mutableStateOf("Ready • Host a table or tap Play to find LAN games") }

              // Play discovery state
              val availableMatches = remember { mutableStateListOf<HostedMatchInfo>() }
              var quickJoinInput by remember { mutableStateOf("") }

              // Active 2D Match state
              var matchConnected by remember { mutableStateOf(false) }
              var localPlaysLight by remember { mutableStateOf(true) }
              var lightTurnNow by remember { mutableStateOf(true) }
              var boardState by remember { mutableStateOf(LanChessRules.freshGrid()) }
              var pickedSquare by remember { mutableStateOf<Pair<Int, Int>?>(null) }
              var legalMoves by remember { mutableStateOf<List<Pair<Int, Int>>>(emptyList()) }
              var lastMove by remember { mutableStateOf<MoveRecord?>(null) }
              var opponentLabel by remember { mutableStateOf("Opponent (Waiting...)") }

              // Networking references
              var tcpServerRef by remember { mutableStateOf<ServerSocket?>(null) }
              var activeSocketRef by remember { mutableStateOf<Socket?>(null) }
              var socketWriterRef by remember { mutableStateOf<PrintWriter?>(null) }
              var beaconJobRef by remember { mutableStateOf<Job?>(null) }
              var serverAcceptJobRef by remember { mutableStateOf<Job?>(null) }

              fun registerDiscoveredHost(title: String, ip: String, port: Int) {
                  val now = System.currentTimeMillis()
                  val idx = availableMatches.indexOfFirst { it.hostAddress == ip }
                  val info = HostedMatchInfo(title, ip, port, now)
                  if (idx >= 0) availableMatches[idx] = info else availableMatches.add(info)
              }

              fun disconnectSession() {
                  beaconJobRef?.cancel()
                  serverAcceptJobRef?.cancel()
                  try { activeSocketRef?.close() } catch (_: Exception) {}
                  try { tcpServerRef?.close() } catch (_: Exception) {}
                  activeSocketRef = null
                  tcpServerRef = null
                  socketWriterRef = null
                  isHostingRoom = false
                  matchConnected = false
                  pickedSquare = null
                  legalMoves = emptyList()
              }

              fun handleIncomingPacket(line: String) {
                  val parts = line.trim().split(":")
                  if (parts.isEmpty()) return
                  when (parts[0]) {
                      "MOVE" -> if (parts.size >= 5) {
                          val r0 = parts[1].toIntOrNull() ?: return
                          val c0 = parts[2].toIntOrNull() ?: return
                          val r1 = parts[3].toIntOrNull() ?: return
                          val c1 = parts[4].toIntOrNull() ?: return
                          val updated = LanChessRules.cloneGrid(boardState)
                          val moving = updated[r0][c0] ?: return
                          updated[r1][c1] = if (moving.kind == 'P' && (r1 == 0 || r1 == 7)) {
                              ChessCellPiece('Q', moving.isLight)
                          } else moving
                          updated[r0][c0] = null
                          boardState = updated
                          lastMove = MoveRecord(r0, c0, r1, c1)
                          lightTurnNow = !lightTurnNow
                          pickedSquare = null
                          legalMoves = emptyList()
                      }
                      "RESET" -> {
                          boardState = LanChessRules.freshGrid()
                          lightTurnNow = true
                          pickedSquare = null
                          legalMoves = emptyList()
                          lastMove = null
                          statusBanner = "New game started • White to move"
                      }
                  }
              }

              fun bindMatchSocket(sock: Socket, writer: PrintWriter, reader: BufferedReader, amHost: Boolean, title: String) {
                  scope.launch(Dispatchers.IO) {
                      try {
                          sock.tcpNoDelay = true
                          sock.keepAlive = true
                          val remoteIp = sock.inetAddress?.hostAddress ?: "LAN Peer"
                          withContext(Dispatchers.Main) {
                              activeSocketRef = sock
                              socketWriterRef = writer
                              localPlaysLight = amHost
                              lightTurnNow = true
                              boardState = LanChessRules.freshGrid()
                              lastMove = null
                              pickedSquare = null
                              legalMoves = emptyList()
                              matchConnected = true
                              opponentLabel = "$title ($remoteIp)"
                              statusBanner = if (amHost) "Connected! You play White" else "Connected! You play Black"
                          }
                          while (sock.isConnected && !sock.isClosed) {
                              val incoming = reader.readLine() ?: break
                              if (incoming == "PING") continue
                              withContext(Dispatchers.Main) {
                                  handleIncomingPacket(incoming)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          withContext(Dispatchers.Main) {
                              if (matchConnected) {
                                  disconnectSession()
                                  statusBanner = "Opponent left the match"
                              }
                          }
                      }
                  }
              }

              fun startHostingTable() {
                  disconnectSession()
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  val cleanTitle = hostRoomTitle.trim().ifEmpty { "Chess.com LAN" }.replace("|", " ")
                  isHostingRoom = true
                  statusBanner = "Hosting \"$cleanTitle\" • Code: ${endpoint.roomCode} (${endpoint.ip})"

                  // 1. Multi-interface UDP Broadcast Beacon
                  beaconJobRef = scope.launch(Dispatchers.IO) {
                      var udpSock: DatagramSocket? = null
                      try {
                          udpSock = DatagramSocket()
                          udpSock.broadcast = true
                          val targets = listOf(
                              endpoint.broadcastIp,
                              "255.255.255.255",
                              "192.168.43.255",
                              "192.168.234.255"
                          ).distinct()
                          while (isActive && isHostingRoom && !matchConnected) {
                              val payload = "MULTICHESS|$cleanTitle|${endpoint.ip}|45455".toByteArray()
                              for (t in targets) {
                                  try {
                                      val pkt = DatagramPacket(payload, payload.size, InetAddress.getByName(t), 45454)
                                      udpSock.send(pkt)
                                  } catch (_: Exception) {}
                              }
                              delay(850)
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { udpSock?.close() } catch (_: Exception) {}
                      }
                  }

                  // 2. Persistent TCP Server handling both Scanner Probes (QUERY_ROOM) and Match Joins (JOIN_MATCH)
                  serverAcceptJobRef = scope.launch(Dispatchers.IO) {
                      try {
                          val server = ServerSocket()
                          server.reuseAddress = true
                          server.bind(InetSocketAddress("0.0.0.0", 45455))
                          tcpServerRef = server
                          while (isActive && isHostingRoom && !matchConnected) {
                              val client = server.accept()
                              launch(Dispatchers.IO) {
                                  try {
                                      client.soTimeout = 3500
                                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                                      val writer = PrintWriter(client.getOutputStream(), true)
                                      val firstLine = reader.readLine() ?: ""
                                      if (firstLine.startsWith("QUERY_ROOM")) {
                                          writer.println("ROOM_INFO|$cleanTitle|${endpoint.ip}|45455")
                                          client.close()
                                      } else if (firstLine.startsWith("JOIN_MATCH")) {
                                          client.soTimeout = 0
                                          writer.println("MATCH_START|$cleanTitle")
                                          beaconJobRef?.cancel()
                                          try { server.close() } catch (_: Exception) {}
                                          bindMatchSocket(client, writer, reader, amHost = true, title = cleanTitle)
                                      } else {
                                          client.close()
                                      }
                                  } catch (_: Exception) {
                                      try { client.close() } catch (_: Exception) {}
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              if (!matchConnected) {
                                  isHostingRoom = false
                              }
                          }
                      }
                  }
              }

              // Fast Parallel TCP Subnet + Hotspot Gateway Scanner (Finds games even when UDP broadcast is blocked)
              fun scanSubnetForHosts() {
                  if (isScanningLan) return
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  isScanningLan = true
                  scope.launch(Dispatchers.IO) {
                      try {
                          val prefix = endpoint.subnetPrefix
                          val priorityIps = mutableListOf(
                              "${prefix}1",
                              "192.168.43.1",
                              "192.168.234.1"
                          )
                          for (i in 1..254) {
                              val candidate = "$prefix$i"
                              if (candidate != endpoint.ip && !priorityIps.contains(candidate)) {
                                  priorityIps.add(candidate)
                              }
                          }
                          // Sweep in parallel chunks of 45 sockets with a 280ms connect timeout
                          for (batch in priorityIps.chunked(45)) {
                              val jobs = batch.map { targetIp ->
                                  async(Dispatchers.IO) {
                                      var probe: Socket? = null
                                      try {
                                          probe = Socket()
                                          probe.connect(InetSocketAddress(targetIp, 45455), 280)
                                          probe.soTimeout = 400
                                          val writer = PrintWriter(probe.getOutputStream(), true)
                                          val reader = BufferedReader(InputStreamReader(probe.getInputStream()))
                                          writer.println("QUERY_ROOM")
                                          val reply = reader.readLine() ?: ""
                                          if (reply.startsWith("ROOM_INFO|")) {
                                              val segs = reply.split("|")
                                              if (segs.size >= 4) {
                                                  val rTitle = segs[1]
                                                  val rPort = segs[3].toIntOrNull() ?: 45455
                                                  withContext(Dispatchers.Main) {
                                                      registerDiscoveredHost(rTitle, targetIp, rPort)
                                                  }
                                              }
                                          }
                                      } catch (_: Exception) {
                                      } finally {
                                          try { probe?.close() } catch (_: Exception) {}
                                      }
                                  }
                              }
                              jobs.awaitAll()
                          }
                      } finally {
                          withContext(Dispatchers.Main) {
                              isScanningLan = false
                          }
                      }
                  }
              }

              fun joinHostedTable(rawTarget: String, targetPort: Int, fallbackTitle: String) {
                  val trimmed = rawTarget.trim()
                  if (trimmed.isEmpty()) return
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  // Allow 1-3 digit Quick Room Code (e.g. "1" -> "192.168.43.1") OR full IP address
                  val resolvedIp = if (trimmed.all { it.isDigit() } && trimmed.length <= 3) {
                      "${endpoint.subnetPrefix}$trimmed"
                  } else {
                      trimmed
                  }
                  disconnectSession()
                  statusBanner = "Connecting to $resolvedIp:$targetPort..."
                  scope.launch(Dispatchers.IO) {
                      try {
                          val sock = Socket()
                          sock.connect(InetSocketAddress(resolvedIp, targetPort), 3500)
                          sock.soTimeout = 4000
                          val writer = PrintWriter(sock.getOutputStream(), true)
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream()))
                          writer.println("JOIN_MATCH|Challenger")
                          val handshake = reader.readLine() ?: ""
                          if (handshake.startsWith("MATCH_START")) {
                              val title = handshake.split("|").getOrNull(1) ?: fallbackTitle
                              sock.soTimeout = 0
                              bindMatchSocket(sock, writer, reader, amHost = false, title = title)
                          } else {
                              sock.close()
                              withContext(Dispatchers.Main) {
                                  statusBanner = "Host did not accept match handshake"
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              statusBanner = "Cannot reach $resolvedIp (${e.localizedMessage ?: "timeout"})"
                          }
                      }
                  }
              }

              // Background UDP Listener with Android MulticastLock
              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      var mLock: WifiManager.MulticastLock? = null
                      var listenSock: DatagramSocket? = null
                      try {
                          val wm = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                          mLock = wm?.createMulticastLock("MultiChessLanLock")?.apply {
                              setReferenceCounted(true)
                              acquire()
                          }
                          listenSock = DatagramSocket(null)
                          listenSock.reuseAddress = true
                          listenSock.bind(InetSocketAddress(45454))
                          listenSock.soTimeout = 2000
                          val buf = ByteArray(512)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  listenSock.receive(pkt)
                                  val msg = String(pkt.data, 0, pkt.length)
                                  if (msg.startsWith("MULTICHESS|")) {
                                      val segs = msg.split("|")
                                      if (segs.size >= 4) {
                                          val rName = segs[1]
                                          val rIp = pkt.address?.hostAddress ?: segs[2]
                                          val rPort = segs[3].toIntOrNull() ?: 45455
                                          if (rIp != endpoint.ip) {
                                              withContext(Dispatchers.Main) {
                                                  registerDiscoveredHost(rName, rIp, rPort)
                                              }
                                          }
                                      }
                                  }
                              } catch (_: SocketTimeoutException) {}
                              val cutoff = System.currentTimeMillis() - 8000
                              withContext(Dispatchers.Main) {
                                  availableMatches.removeAll { it.lastBeaconMs < cutoff }
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { listenSock?.close() } catch (_: Exception) {}
                          try { if (mLock?.isHeld == true) mLock.release() } catch (_: Exception) {}
                      }
                  }
              }

              LaunchedEffect(activeTab) {
                  if (activeTab == 1 && !matchConnected) {
                      scanSubnetForHosts()
                  }
              }

              val inCheck = LanChessRules.kingThreatened(boardState, lightTurnNow)
              val hasMoves = LanChessRules.hasAnyLegalMove(boardState, lightTurnNow)
              val checkedKingSquare = if (inCheck) LanChessRules.findKingSquare(boardState, lightTurnNow) else null
