                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      OutlinedTextField(
                                          value = quickJoinInput,
                                          onValueChange = { quickJoinInput = it },
                                          label = { Text("Room Code (e.g. 1) or Host IP") },
                                          singleLine = true,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Spacer(modifier = Modifier.width(10.dp))
                                      ChessComGreenButton(
                                          text = "Join",
                                          isDanger = false,
                                          onClick = { joinHostedTable(quickJoinInput, 45455, "LAN Opponent") }
                                      )
                                  }
                              }
                          }
                      }

                      // TOP PLAYER BAR (Opponent in Chess.com Layout)
                      val topIsLight = !perspectiveLight
                      val topAdv = if (topIsLight) matDiff else -matDiff
                      ChessComPlayerBar(
                          name = if (matchConnected) opponentLabel else if (topIsLight) "White Player" else "Black Player",
                          isLightPiece = topIsLight,
                          isTurnActive = (lightTurnNow == topIsLight),
                          materialAdvantage = topAdv,
                          rightStatusText = if (lightTurnNow == topIsLight) "Thinking..." else "Waiting"
                      )

                      // PERFECT 2D CHESS.COM BOARD
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f, fill = false),
                          contentAlignment = Alignment.Center
                      ) {
                          ChessCom2DBoard(
                              grid = boardState,
                              perspectiveLight = perspectiveLight,
                              selectedCell = pickedSquare,
                              highlightedCells = legalMoves,
                              lastMove = lastMove,
                              checkedKingCell = checkedKingSquare,
                              onSquareTapped = { r, c ->
                                  val canMoveNow = !matchConnected || (lightTurnNow == localPlaysLight)
                                  if (!canMoveNow) return@ChessCom2DBoard

                                  val currentPick = pickedSquare
                                  if (currentPick != null && legalMoves.contains(Pair(r, c))) {
                                      val r0 = currentPick.first
                                      val c0 = currentPick.second
                                      val next = LanChessRules.cloneGrid(boardState)
                                      val moving = next[r0][c0]
                                      if (moving != null) {
                                          next[r][c] = if (moving.kind == 'P' && (r == 0 || r == 7)) {
                                              ChessCellPiece('Q', moving.isLight)
                                          } else moving
                                          next[r0][c0] = null
                                          boardState = next
                                          lastMove = MoveRecord(r0, c0, r, c)
                                          lightTurnNow = !lightTurnNow
                                          pickedSquare = null
                                          legalMoves = emptyList()
                                          if (matchConnected) {
                                              scope.launch(Dispatchers.IO) {
                                                  try { socketWriterRef?.println("MOVE:$r0:$c0:$r:$c") } catch (_: Exception) {}
                                              }
                                          }
                                      }
                                  } else {
                                      val tappedPiece = boardState[r][c]
                                      if (tappedPiece != null && tappedPiece.isLight == lightTurnNow) {
                                          pickedSquare = Pair(r, c)
                                          legalMoves = LanChessRules.validTargetsFor(boardState, r, c)
                                      } else {
                                          pickedSquare = null
                                          legalMoves = emptyList()
                                      }
                                  }
                              }
                          )
                      }

                      // BOTTOM PLAYER BAR (Local Player in Chess.com Layout + Reset / Exit Action)
                      val botIsLight = perspectiveLight
                      val botAdv = if (botIsLight) matDiff else -matDiff
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Box(modifier = Modifier.weight(1f)) {
                              ChessComPlayerBar(
                                  name = if (matchConnected) "You (${if (botIsLight) "White" else "Black"})" else "You (Local Board)",
                                  isLightPiece = botIsLight,
                                  isTurnActive = (lightTurnNow == botIsLight),
                                  materialAdvantage = botAdv,
                                  rightStatusText = turnBadgeText
                              )
                          }
                          Spacer(modifier = Modifier.width(8.dp))
                          TextButton(
                              onClick = {
                                  boardState = LanChessRules.freshGrid()
                                  lightTurnNow = true
                                  pickedSquare = null
                                  legalMoves = emptyList()
                                  lastMove = null
                                  scope.launch(Dispatchers.IO) {
                                      try { socketWriterRef?.println("RESET") } catch (_: Exception) {}
                                  }
                              },
                              modifier = Modifier
                                  .clip(RoundedCornerShape(8.dp))
                                  .background(ChessPanelDark)
                          ) {
                              Text("New", color = ChessGreenBtn, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          }
                          if (matchConnected) {
                              Spacer(modifier = Modifier.width(4.dp))
                              TextButton(
                                  onClick = {
                                      disconnectSession()
                                      statusBanner = "Disconnected from match"
                                  },
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(ChessPanelDark)
                              ) {
                                  Text("Leave", color = Color(0xFFE53935), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              }
                          }
                      }
                  }

                  // CHESS.COM BOTTOM NAVIGATION BAR (Strictly ONLY "Host" and "Play" Tabs)
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(ChessNavDark)
                          .padding(vertical = 6.dp, horizontal = 24.dp),
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      val navItems = listOf(
                          Triple(0, "Host", 'K'),
                          Triple(1, "Play", 'P')
                      )
                      navItems.forEach { (idx, label, iconKind) ->
                          val selected = activeTab == idx
                          Row(
                              modifier = Modifier
                                  .weight(1f)
                                  .padding(horizontal = 8.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(if (selected) Color(0xFF33312E) else Color.Transparent)
                                  .clickable {
                                      activeTab = idx
                                      if (matchConnected) {
                                          // Keep match running while switching tab view if desired
                                      }
                                  }
                                  .padding(vertical = 8.dp, horizontal = 14.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Canvas(modifier = Modifier.size(24.dp)) {
                                  NeoPieceDrawer.drawPiece(
                                      this,
                                      kind = iconKind,
                                      isLight = selected,
                                      cx = size.width / 2f,
                                      cy = size.height / 2f,
                                      cellDim = size.width * 0.95f
                                  )
                              }
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(
                                  text = label,
                                  color = if (selected) ChessGreenBtn else ChessTextMuted,
                                  fontWeight = FontWeight.ExtraBold,
                                  fontSize = 15.sp
                              )
                          }
                      }
                  }
              }
          }

