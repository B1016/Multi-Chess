              val mainColor = if (isDanger) Color(0xFFD32F2F) else ChessGreenBtn
              val lipColor = if (isDanger) Color(0xFF9A1B1B) else ChessGreenShadow
              Box(
                  modifier = Modifier
                      .clip(RoundedCornerShape(8.dp))
                      .background(lipColor)
                      .clickable { onClick() }
                      .padding(bottom = 3.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .clip(RoundedCornerShape(8.dp))
                          .background(mainColor)
                          .padding(horizontal = 16.dp, vertical = 9.dp),
