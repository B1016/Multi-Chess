name: Build Multi Chess APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  assemble-multi-chess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK and Gradle 8.9
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/g89.zip
          unzip -q /tmp/g89.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Generate Multi Chess Project Structure
        run: |
          mkdir -p app/src/main/java/com/multichess/lan
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MultiChessLAN"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_PROPS

          cat << 'EOF_ROOT_GRADLE' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_ROOT_GRADLE

          cat << 'EOF_APP_GRADLE' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.multichess.lan"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.multichess.lan"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF_APP_GRADLE

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Multi Chess"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_ICON_BG' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Chess.com Classic Tournament Green & Cream Checkered Backdrop -->
              <path
                  android:fillColor="#769656"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#EEEED2"
                  android:pathData="M0,0h54v54h-54z M54,54h54v54h-54z" />
              <path
                  android:fillColor="#262421"
                  android:fillAlpha="0.35"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF_ICON_BG

          cat << 'EOF_ICON_FG' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Chess.com Neo Style Black King Piece -->
              <path
                  android:fillColor="#262421"
                  android:strokeColor="#11100F"
                  android:strokeWidth="2.4"
                  android:pathData="M51,18h6v6h6v5h-6v6h-6v-6h-6v-5h6z M36,42 C36,33 47,32 54,37 C61,32 72,33 72,42 C72,50 67,58 65,65 L72,71 L72,76 L36,76 L36,71 L43,65 C41,58 36,50 36,42 Z M32,78h44v5h-44z M29,85h50v6h-50z" />
              <!-- Inner Specular Highlights (Neo Piece Style) -->
              <path
                  android:fillColor="#5C5955"
                  android:pathData="M43,64h22v2.5h-22z M36,72h36v2.2h-36z M33,80h42v1.8h-42z" />
          </vector>
          EOF_ICON_FG

          cat << 'EOF_MIPMAP' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_MIPMAP

          cat << 'EOF_KOTLIN' > app/src/main/java/com/multichess/lan/MainActivity.kt
          package com.multichess.lan

          import android.content.Context
          import android.net.wifi.WifiManager
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Wifi
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.StrokeJoin
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Fill
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.*
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.PrintWriter
          import java.net.*
          import kotlin.math.abs

          // Chess.com Official Color Palette
          val ChessBgDark = Color(0xFF302E2B)
          val ChessPanelDark = Color(0xFF262421)
          val ChessNavDark = Color(0xFF1F1E1B)
          val ChessGreenBtn = Color(0xFF81B64C)
          val ChessGreenShadow = Color(0xFF537133)
          val ChessBoardLight = Color(0xFFEEEED2)
          val ChessBoardDark = Color(0xFF769656)
          val ChessHighlightLight = Color(0xFFF6F669)
          val ChessHighlightDark = Color(0xFFBACA44)
          val ChessTextMuted = Color(0xFF989795)

          data class HostedMatchInfo(
              val roomTitle: String,
              val hostAddress: String,
              val tcpPort: Int,
              val lastBeaconMs: Long
          )

          data class MoveRecord(
              val r0: Int,
              val c0: Int,
              val r1: Int,
              val c1: Int
          )

          data class ChessCellPiece(
              val kind: Char, // K, Q, R, B, N, P
              val isLight: Boolean
          ) {
              fun pointValue(): Int = when (kind) {
                  'Q' -> 9
                  'R' -> 5
                  'B', 'N' -> 3
                  'P' -> 1
                  else -> 0
              }
          }

          object LanChessRules {
              fun freshGrid(): Array<Array<ChessCellPiece?>> {
                  val grid = Array(8) { arrayOfNulls<ChessCellPiece>(8) }
                  val majorRow = charArrayOf('R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R')
                  for (c in 0..7) {
                      grid[0][c] = ChessCellPiece(majorRow[c], isLight = false)
                      grid[1][c] = ChessCellPiece('P', isLight = false)
                      grid[6][c] = ChessCellPiece('P', isLight = true)
                      grid[7][c] = ChessCellPiece(majorRow[c], isLight = true)
                  }
                  return grid
              }

              fun cloneGrid(src: Array<Array<ChessCellPiece?>>): Array<Array<ChessCellPiece?>> {
                  return Array(8) { r -> Array(8) { c -> src[r][c] } }
              }

              private fun pathClear(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int, r1: Int, c1: Int): Boolean {
                  val stepR = (r1 - r0).coerceIn(-1, 1)
                  val stepC = (c1 - c0).coerceIn(-1, 1)
                  var curR = r0 + stepR
                  var curC = c0 + stepC
                  while (curR != r1 || curC != c1) {
                      if (grid[curR][curC] != null) return false
                      curR += stepR
                      curC += stepC
                  }
                  return true
              }

              fun canReach(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int, r1: Int, c1: Int, ignoreCheck: Boolean = false): Boolean {
                  if (r1 !in 0..7 || c1 !in 0..7 || (r0 == r1 && c0 == c1)) return false
                  val mover = grid[r0][c0] ?: return false
                  val dest = grid[r1][c1]
                  if (dest != null && dest.isLight == mover.isLight) return false

                  val dR = r1 - r0
                  val dC = c1 - c0
                  val aR = abs(dR)
                  val aC = abs(dC)

                  val geomOk = when (mover.kind) {
                      'P' -> {
                          val fwd = if (mover.isLight) -1 else 1
                          val homeRow = if (mover.isLight) 6 else 1
                          if (dC == 0 && dest == null) {
                              dR == fwd || (r0 == homeRow && dR == 2 * fwd && grid[r0 + fwd][c0] == null)
                          } else if (aC == 1 && dR == fwd) {
                              dest != null && dest.isLight != mover.isLight
                          } else false
                      }
                      'R' -> (r0 == r1 || c0 == c1) && pathClear(grid, r0, c0, r1, c1)
                      'N' -> (aR == 2 && aC == 1) || (aR == 1 && aC == 2)
                      'B' -> (aR == aC) && pathClear(grid, r0, c0, r1, c1)
                      'Q' -> (r0 == r1 || c0 == c1 || aR == aC) && pathClear(grid, r0, c0, r1, c1)
                      'K' -> aR <= 1 && aC <= 1
                      else -> false
                  }
                  if (!geomOk) return false
                  if (ignoreCheck) return true

                  val nextGrid = cloneGrid(grid)
                  nextGrid[r1][c1] = if (mover.kind == 'P' && (r1 == 0 || r1 == 7)) {
                      ChessCellPiece('Q', mover.isLight)
                  } else mover
                  nextGrid[r0][c0] = null
                  return !kingThreatened(nextGrid, mover.isLight)
              }

              fun findKingSquare(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Pair<Int, Int>? {
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c]
                          if (p != null && p.isLight == lightSide && p.kind == 'K') {
                              return Pair(r, c)
                          }
                      }
                  }
                  return null
              }

              fun kingThreatened(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Boolean {
                  val kingPos = findKingSquare(grid, lightSide) ?: return true
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val enemy = grid[r][c]
                          if (enemy != null && enemy.isLight != lightSide) {
                              if (canReach(grid, r, c, kingPos.first, kingPos.second, ignoreCheck = true)) return true
                          }
                      }
                  }
                  return false
              }

              fun validTargetsFor(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int): List<Pair<Int, Int>> {
                  val res = mutableListOf<Pair<Int, Int>>()
                  for (r in 0..7) {
                      for (c in 0..7) {
                          if (canReach(grid, r0, c0, r, c)) res.add(Pair(r, c))
                      }
                  }
                  return res
              }

              fun hasAnyLegalMove(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Boolean {
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c]
                          if (p != null && p.isLight == lightSide) {
                              if (validTargetsFor(grid, r, c).isNotEmpty()) return true
                          }
                      }
                  }
                  return false
              }

              fun materialDiff(grid: Array<Array<ChessCellPiece?>>): Int {
                  var whitePts = 0
                  var blackPts = 0
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c] ?: continue
                          if (p.isLight) whitePts += p.pointValue() else blackPts += p.pointValue()
                      }
                  }
                  return whitePts - blackPts
              }
          }

          object NeoPieceDrawer {
              fun drawPiece(scope: DrawScope, kind: Char, isLight: Boolean, cx: Float, cy: Float, cellDim: Float) {
                  val fillCol = if (isLight) Color(0xFFF9F9F7) else Color(0xFF2B2926)
                  val strokeCol = if (isLight) Color(0xFF262421) else Color(0xFF121110)
                  val innerAccent = if (isLight) Color(0xFF262421) else Color(0xFF7A7772)
                  val u = cellDim * 0.01f // 100x100 virtual box centered at (cx, cy)
                  val left = cx - 50f * u
                  val top = cy - 50f * u
                  val outlineStroke = Stroke(width = 4.2f * u, cap = StrokeCap.Round, join = StrokeJoin.Round)
                  val detailStroke = Stroke(width = 3.0f * u, cap = StrokeCap.Round, join = StrokeJoin.Round)

                  // Subtle ground contact shadow (Chess.com Neo 2D style)
                  scope.drawOval(
                      color = Color(0x33000000),
                      topLeft = Offset(left + 16f * u, top + 82f * u),
                      size = Size(68f * u, 9f * u)
                  )

                  val body = Path()
                  when (kind) {
                      'P' -> {
                          // Neo Pawn: Round head, collar ring, flared curved pedestal, wide base
                          body.moveTo(left + 22f * u, top + 84f * u)
                          body.lineTo(left + 78f * u, top + 84f * u)
                          body.lineTo(left + 74f * u, top + 75f * u)
                          body.cubicTo(left + 64f * u, top + 68f * u, left + 60f * u, top + 54f * u, left + 58f * u, top + 46f * u)
                          body.lineTo(left + 42f * u, top + 46f * u)
                          body.cubicTo(left + 40f * u, top + 54f * u, left + 36f * u, top + 68f * u, left + 26f * u, top + 75f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)

                          // Pawn head circle
                          scope.drawCircle(
                              color = fillCol,
                              radius = 14.5f * u,
                              center = Offset(cx, top + 31f * u)
                          )
                          scope.drawCircle(
                              color = strokeCol,
                              radius = 14.5f * u,
                              center = Offset(cx, top + 31f * u),
                              style = outlineStroke
                          )
                      }
                      'R' -> {
                          // Neo Rook: Three battlements, sturdy tower shaft, stepped base
                          body.moveTo(left + 20f * u, top + 84f * u)
                          body.lineTo(left + 80f * u, top + 84f * u)
                          body.lineTo(left + 75f * u, top + 73f * u)
                          body.lineTo(left + 68f * u, top + 66f * u)
                          body.lineTo(left + 66f * u, top + 38f * u)
                          body.lineTo(left + 74f * u, top + 32f * u)
                          body.lineTo(left + 74f * u, top + 20f * u)
                          body.lineTo(left + 63f * u, top + 20f * u)
                          body.lineTo(left + 63f * u, top + 27f * u)
                          body.lineTo(left + 55f * u, top + 27f * u)
                          body.lineTo(left + 55f * u, top + 20f * u)
                          body.lineTo(left + 45f * u, top + 20f * u)
                          body.lineTo(left + 45f * u, top + 27f * u)
                          body.lineTo(left + 37f * u, top + 27f * u)
                          body.lineTo(left + 37f * u, top + 20f * u)
                          body.lineTo(left + 26f * u, top + 20f * u)
                          body.lineTo(left + 26f * u, top + 32f * u)
                          body.lineTo(left + 34f * u, top + 38f * u)
                          body.lineTo(left + 32f * u, top + 66f * u)
                          body.lineTo(left + 25f * u, top + 73f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)
                      }
                      'N' -> {
                          // Neo Knight: Iconic horse profile facing left with pointed ear, snout, and curved mane
                          body.moveTo(left + 20f * u, top + 84f * u)
                          body.lineTo(left + 78f * u, top + 84f * u)
                          body.lineTo(left + 74f * u, top + 73f * u)
                          body.cubicTo(left + 76f * u, top + 52f * u, left + 72f * u, top + 32f * u, left + 56f * u, top + 22f * u)
                          body.lineTo(left + 50f * u, top + 14f * u)
                          body.lineTo(left + 44f * u, top + 22f * u)
                          body.cubicTo(left + 33f * u, top + 24f * u, left + 22f * u, top + 35f * u, left + 20f * u, top + 46f * u)
                          body.lineTo(left + 28f * u, top + 50f * u)
                          body.lineTo(left + 42f * u, top + 43f * u)
                          body.cubicTo(left + 40f * u, top + 54f * u, left + 31f * u, top + 63f * u, left + 24f * u, top + 73f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)
                          // Eye dot
                          scope.drawCircle(
                              color = innerAccent,
                              radius = 2.8f * u,
                              center = Offset(left + 36f * u, top + 34f * u)
                          )
                      }
                      'B' -> {
                          // Neo Bishop: Mitre dome with finial orb and diagonal cross/slit
                          body.moveTo(left + 20f * u, top + 84f * u)
                          body.lineTo(left + 80f * u, top + 84f * u)
                          body.lineTo(left + 74f * u, top + 73f * u)
                          body.lineTo(left + 64f * u, top + 66f * u)
                          body.cubicTo(left + 72f * u, top + 52f * u, left + 69f * u, top + 32f * u, left + 50f * u, top + 23f * u)
                          body.cubicTo(left + 31f * u, top + 32f * u, left + 28f * u, top + 52f * u, left + 36f * u, top + 66f * u)
                          body.lineTo(left + 26f * u, top + 73f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)
                          // Top orb
                          scope.drawCircle(color = fillCol, radius = 4.8f * u, center = Offset(cx, top + 17f * u))
                          scope.drawCircle(color = strokeCol, radius = 4.8f * u, center = Offset(cx, top + 17f * u), style = detailStroke)
                          // Mitre plus mark
                          scope.drawLine(innerAccent, Offset(cx, top + 34f * u), Offset(cx, top + 46f * u), strokeWidth = 3.2f * u, cap = StrokeCap.Round)
                          scope.drawLine(innerAccent, Offset(cx - 6f * u, top + 40f * u), Offset(cx + 6f * u, top + 40f * u), strokeWidth = 3.2f * u, cap = StrokeCap.Round)
                      }
                      'Q' -> {
                          // Neo Queen: 5-point coronet crown with pearl orbs
                          body.moveTo(left + 19f * u, top + 84f * u)
                          body.lineTo(left + 81f * u, top + 84f * u)
                          body.lineTo(left + 76f * u, top + 72f * u)
                          body.lineTo(left + 68f * u, top + 65f * u)
                          body.lineTo(left + 80f * u, top + 30f * u)
                          body.lineTo(left + 63f * u, top + 48f * u)
                          body.lineTo(left + 58f * u, top + 26f * u)
                          body.lineTo(left + 50f * u, top + 46f * u)
                          body.lineTo(left + 42f * u, top + 26f * u)
                          body.lineTo(left + 37f * u, top + 48f * u)
                          body.lineTo(left + 20f * u, top + 30f * u)
                          body.lineTo(left + 32f * u, top + 65f * u)
                          body.lineTo(left + 24f * u, top + 72f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)
                          val pearls = listOf(
                              Offset(left + 20f * u, top + 26f * u),
                              Offset(left + 41f * u, top + 22f * u),
                              Offset(left + 59f * u, top + 22f * u),
                              Offset(left + 80f * u, top + 26f * u)
                          )
                          pearls.forEach { pt ->
                              scope.drawCircle(color = fillCol, radius = 3.8f * u, center = pt)
                              scope.drawCircle(color = strokeCol, radius = 3.8f * u, center = pt, style = detailStroke)
                          }
                      }
                      else -> {
                          // Neo King ('K'): Royal arched crown + top cross
                          scope.drawLine(strokeCol, Offset(cx, top + 11f * u), Offset(cx, top + 25f * u), strokeWidth = 4.8f * u, cap = StrokeCap.Round)
                          scope.drawLine(strokeCol, Offset(cx - 7f * u, top + 17f * u), Offset(cx + 7f * u, top + 17f * u), strokeWidth = 4.8f * u, cap = StrokeCap.Round)

                          body.moveTo(left + 19f * u, top + 84f * u)
                          body.lineTo(left + 81f * u, top + 84f * u)
                          body.lineTo(left + 76f * u, top + 72f * u)
                          body.lineTo(left + 68f * u, top + 65f * u)
                          body.cubicTo(left + 78f * u, top + 48f * u, left + 75f * u, top + 30f * u, left + 58f * u, top + 30f * u)
                          body.cubicTo(left + 53f * u, top + 30f * u, left + 51f * u, top + 34f * u, left + 50f * u, top + 36f * u)
                          body.cubicTo(left + 49f * u, top + 34f * u, left + 47f * u, top + 30f * u, left + 42f * u, top + 30f * u)
                          body.cubicTo(left + 25f * u, top + 30f * u, left + 22f * u, top + 48f * u, left + 32f * u, top + 65f * u)
                          body.lineTo(left + 24f * u, top + 72f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)
                      }
                  }

                  // Neo Base Collar Highlight Lines
                  scope.drawLine(
                      color = innerAccent,
                      start = Offset(left + 27f * u, top + 75f * u),
                      end = Offset(left + 73f * u, top + 75f * u),
                      strokeWidth = 2.6f * u,
                      cap = StrokeCap.Round
                  )
              }
          }

          data class LanEndpoint(
              val ip: String,
              val subnetPrefix: String,
              val broadcastIp: String,
              val roomCode: String
          )

          object NetworkAddressHelper {
              fun findBestLanEndpoint(): LanEndpoint {
                  val candidates = mutableListOf<Pair<Int, LanEndpoint>>()
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      while (interfaces.hasMoreElements()) {
                          val nif = interfaces.nextElement()
                          if (!nif.isUp || nif.isLoopback) continue
                          val name = nif.name.lowercase()
                          // Skip cellular / dummy / vpn interfaces so LAN discovery always binds to Wi-Fi or Hotspot
                          if (name.startsWith("rmnet") || name.startsWith("ccmni") || name.startsWith("dummy") || name.startsWith("tun")) {
                              continue
                          }
                          val priority = when {
                              name.startsWith("ap") || name.startsWith("swlan") || name.contains("wlan") -> 100
                              name.startsWith("rndis") || name.startsWith("eth") -> 80
                              else -> 40
                          }
                          for (ia in nif.interfaceAddresses) {
                              val addr = ia.address
                              if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                  val ip = addr.hostAddress ?: continue
                                  val parts = ip.split(".")
                                  if (parts.size == 4) {
                                      val prefix = "${parts[0]}.${parts[1]}.${parts[2]}."
                                      val bcast = ia.broadcast?.hostAddress ?: "${prefix}255"
                                      val code = parts[3]
                                      val isPrivate = ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")
                                      val score = priority + (if (isPrivate) 50 else 0)
                                      candidates.add(score to LanEndpoint(ip, prefix, bcast, code))
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return candidates.maxByOrNull { it.first }?.second
                      ?: LanEndpoint("192.168.43.1", "192.168.43.", "192.168.43.255", "1")
              }
          }

