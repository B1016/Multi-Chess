          @Composable
          fun ChessCom2DBoard(
              grid: Array<Array<ChessCellPiece?>>,
              perspectiveLight: Boolean,
              selectedCell: Pair<Int, Int>?,
              highlightedCells: List<Pair<Int, Int>>,
              lastMove: MoveRecord?,
              checkedKingCell: Pair<Int, Int>?,
              onSquareTapped: (Int, Int) -> Unit
          ) {
              val coordPaint = remember {
                  android.graphics.Paint().apply {
                      isAntiAlias = true
                      isFakeBoldText = true
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .aspectRatio(1f)
                      .clip(RoundedCornerShape(6.dp))
                      .border(2.dp, Color(0xFF1F1E1B), RoundedCornerShape(6.dp))
              ) {
                  Canvas(
                      modifier = Modifier
                          .fillMaxSize()
                          .pointerInput(perspectiveLight) {
                              detectTapGestures { tapOffset ->
                                  val cellW = size.width / 8f
                                  val cellH = size.height / 8f
                                  val visCol = (tapOffset.x / cellW).toInt().coerceIn(0, 7)
                                  val visRow = (tapOffset.y / cellH).toInt().coerceIn(0, 7)
                                  val boardRow = if (perspectiveLight) visRow else 7 - visRow
                                  val boardCol = if (perspectiveLight) visCol else 7 - visCol
                                  onSquareTapped(boardRow, boardCol)
                              }
                          }
                  ) {
                      val cellW = size.width / 8f
                      val cellH = size.height / 8f
                      coordPaint.textSize = cellW * 0.20f

                      for (visR in 0..7) {
                          for (visC in 0..7) {
                              val r = if (perspectiveLight) visR else 7 - visR
                              val c = if (perspectiveLight) visC else 7 - visC
                              val left = visC * cellW
                              val top = visR * cellH
                              val isLightSq = (r + c) % 2 == 0

                              val isSelected = (selectedCell?.first == r && selectedCell.second == c)
                              val isLastMove = (lastMove != null && ((lastMove.r0 == r && lastMove.c0 == c) || (lastMove.r1 == r && lastMove.c1 == c)))
                              val isKingCheck = (checkedKingCell?.first == r && checkedKingCell.second == c)

                              val sqColor = when {
                                  isKingCheck -> Color(0xFFE64A45)
                                  isSelected || isLastMove -> if (isLightSq) ChessHighlightLight else ChessHighlightDark
                                  isLightSq -> ChessBoardLight
                                  else -> ChessBoardDark
                              }

                              // 1. Flat 2D Chess.com Square
                              drawRect(
                                  color = sqColor,
                                  topLeft = Offset(left, top),
                                  size = Size(cellW, cellH)
                              )

                              // 2. Chess.com Edge Algebraic Coordinates (Rank 1-8 on left edge, File a-h on bottom edge)
                              val labelArgb = if (isLightSq) {
                                  android.graphics.Color.parseColor("#769656")
                              } else {
                                  android.graphics.Color.parseColor("#EEEED2")
                              }
                              coordPaint.color = labelArgb

                              if (visC == 0) {
                                  val rankLabel = (8 - r).toString()
                                  coordPaint.textAlign = android.graphics.Paint.Align.LEFT
                                  drawContext.canvas.nativeCanvas.drawText(
                                      rankLabel,
                                      left + cellW * 0.07f,
                                      top + cellH * 0.24f,
                                      coordPaint
                                  )
                              }
                              if (visR == 7) {
                                  val fileLabel = ('a' + c).toString()
                                  coordPaint.textAlign = android.graphics.Paint.Align.RIGHT
                                  drawContext.canvas.nativeCanvas.drawText(
                                      fileLabel,
                                      left + cellW * 0.93f,
                                      top + cellH * 0.92f,
                                      coordPaint
                                  )
                              }

                              // 3. Draw Chess.com Neo Vector Piece
                              val piece = grid[r][c]
                              if (piece != null) {
                                  NeoPieceDrawer.drawPiece(
                                      scope = this,
                                      kind = piece.kind,
                                      isLight = piece.isLight,
                                      cx = left + cellW / 2f,
                                      cy = top + cellH / 2f,
                                      cellDim = minOf(cellW, cellH)
                                  )
                              }

                              // 4. Draw Chess.com Legal Move Dot or Capture Ring
                              if (highlightedCells.contains(Pair(r, c))) {
                                  val cx = left + cellW / 2f
                                  val cy = top + cellH / 2f
                                  if (piece != null) {
                                      // Translucent dark capture ring around enemy piece
                                      drawCircle(
                                          color = Color(0x40000000),
                                          radius = minOf(cellW, cellH) * 0.43f,
                                          center = Offset(cx, cy),
                                          style = Stroke(width = minOf(cellW, cellH) * 0.09f)
                                      )
                                  } else {
                                      // Translucent dark center dot on empty legal square
                                      drawCircle(
                                          color = Color(0x38000000),
                                          radius = minOf(cellW, cellH) * 0.16f,
                                          center = Offset(cx, cy)
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF_KOTLIN

