          data class LanEndpoint(
              val ip: String,
              val subnetPrefix: String,
              val broadcastIp: String,
              val roomCode: String
          )

          object NetworkAddressHelper {
              fun findBestLanEndpoint(): LanEndpoint {
                  val candidates = mutableListOf<Pair<Int, LanEndpoint>>()
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      while (interfaces.hasMoreElements()) {
                          val nif = interfaces.nextElement()
                          if (!nif.isUp || nif.isLoopback) continue
                          val name = nif.name.lowercase()
                          if (name.startsWith("rmnet") || name.startsWith("ccmni") || name.startsWith("dummy") || name.startsWith("tun")) {
                              continue
                          }
                          val priority = when {
                              name.startsWith("ap") || name.startsWith("swlan") || name.contains("wlan") -> 100
                              name.startsWith("rndis") || name.startsWith("eth") -> 80
                              else -> 40
                          }
                          for (ia in nif.interfaceAddresses) {
                              val addr = ia.address
                              if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                  val ip = addr.hostAddress ?: continue
                                  val parts = ip.split(".")
                                  if (parts.size == 4) {
                                      val prefix = "${parts[0]}.${parts[1]}.${parts[2]}."
                                      val bcast = ia.broadcast?.hostAddress ?: "${prefix}255"
                                      val code = parts[3]
                                      val isPrivate = ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")
                                      val score = priority + (if (isPrivate) 50 else 0)
                                      candidates.add(score to LanEndpoint(ip, prefix, bcast, code))
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return candidates.maxByOrNull { it.first }?.second
                      ?: LanEndpoint("192.168.43.1", "192.168.43.", "192.168.43.255", "1")
              }
          }

          // Background Foreground Service so LAN Hosting & Matches stay alive when minimized or screen off
          class MultiChessLanService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private var multicastLock: WifiManager.MulticastLock? = null

              override fun onCreate() {
                  super.onCreate()
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as? PowerManager
                      wakeLock = pm?.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "MultiChess::LanWakeLock")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      @Suppress("DEPRECATION")
                      wifiLock = wm?.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "MultiChess::LanWifiLock")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                      multicastLock = wm?.createMulticastLock("MultiChess::LanMulticastLock")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  } catch (_: Exception) {}
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val statusText = intent?.getStringExtra("STATUS") ?: "Running in background • LAN match active"
                  val channelId = "multichess_lan_bg"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(
                          channelId,
                          "Multi Chess Background LAN",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      nm.createNotificationChannel(chan)
                  }
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      this.flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }
                  val contentPi = PendingIntent.getActivity(this, 0, openIntent, pendingFlags)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  val notif = builder
                      .setContentTitle("Multi Chess V 1.6 fix by ACE")
                      .setContentText(statusText)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(contentPi)
                      .setOngoing(true)
                      .build()

                  try {
                      startForeground(1501, notif)
                  } catch (_: Exception) {}
                  return START_STICKY
              }

              override fun onDestroy() {
                  try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (_: Exception) {}
                  try { if (wifiLock?.isHeld == true) wifiLock?.release() } catch (_: Exception) {}
                  try { if (multicastLock?.isHeld == true) multicastLock?.release() } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          // Persistent Process-Level LAN Engine so matches and hosting survive app switching & backgrounding
          object LanSessionEngine {
              val engineScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              var activeTab by mutableStateOf(0) // 0 = Host, 1 = Play
              var endpoint by mutableStateOf(NetworkAddressHelper.findBestLanEndpoint())

              var hostRoomTitle by mutableStateOf("Arena Match")
              var isHostingRoom by mutableStateOf(false)
              var isScanningLan by mutableStateOf(false)
              var statusBanner by mutableStateOf("Ready • Castling & En Passant Enabled")

              val availableMatches = mutableStateListOf<HostedMatchInfo>()
              var quickJoinInput by mutableStateOf("")

              var matchConnected by mutableStateOf(false)
              var localPlaysLight by mutableStateOf(true)
              var lightTurnNow by mutableStateOf(true)
              var boardState by mutableStateOf(LanChessRules.freshGrid())
              var boardRevision by mutableStateOf(0)
              var enPassantTarget by mutableStateOf<Pair<Int, Int>?>(null)
              var pickedSquare by mutableStateOf<Pair<Int, Int>?>(null)
              var legalMoves by mutableStateOf<List<Pair<Int, Int>>>(emptyList())
              var lastMove by mutableStateOf<MoveRecord?>(null)
              var specialMoveBadge by mutableStateOf<String?>(null)
              var opponentLabel by mutableStateOf("Opponent (Waiting...)")

              // LAN QR + Browser File Sharing state (Disabled by default as requested)
              var lanShareEnabled by mutableStateOf(false)
              var sharedCustomUri by mutableStateOf<Uri?>(null)
              var sharedFileName by mutableStateOf("Multi-Chess-V1.6-ACE.apk")
              var shareDownloadCount by mutableStateOf(0)
              private var httpShareServerRef: ServerSocket? = null
              private var httpShareJobRef: Job? = null

              private var tcpServerRef: ServerSocket? = null
              private var activeSocketRef: Socket? = null
              private var socketWriterRef: PrintWriter? = null
              private var beaconJobRef: Job? = null
              private var serverAcceptJobRef: Job? = null
              private var heartbeatJobRef: Job? = null
              private var udpListenerStarted = false

              fun updateBgService(ctx: Context, status: String, active: Boolean) {
                  try {
                      val srvIntent = Intent(ctx.applicationContext, MultiChessLanService::class.java).apply {
                          putExtra("STATUS", status)
                      }
                      if (active) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              ctx.applicationContext.startForegroundService(srvIntent)
                          } else {
                              ctx.applicationContext.startService(srvIntent)
                          }
                      } else {
                          ctx.applicationContext.stopService(srvIntent)
                      }
                  } catch (_: Exception) {}
              }

              fun ensureUdpListenerRunning() {
                  if (udpListenerStarted) return
                  udpListenerStarted = true
                  engineScope.launch {
                      var listenSock: DatagramSocket? = null
                      try {
                          listenSock = DatagramSocket(null)
                          listenSock.reuseAddress = true
                          listenSock.bind(InetSocketAddress(45454))
                          listenSock.soTimeout = 2000
                          val buf = ByteArray(512)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  listenSock.receive(pkt)
                                  val msg = String(pkt.data, 0, pkt.length)
                                  if (msg.startsWith("MULTICHESS|")) {
                                      val segs = msg.split("|")
                                      if (segs.size >= 4) {
                                          val rName = segs[1]
                                          val rIp = pkt.address?.hostAddress ?: segs[2]
                                          val rPort = segs[3].toIntOrNull() ?: 45455
                                          if (rIp != endpoint.ip) {
                                              withContext(Dispatchers.Main) {
                                                  registerDiscoveredHost(rName, rIp, rPort)
                                              }
                                          }
                                      }
                                  }
                              } catch (_: SocketTimeoutException) {}
                              val cutoff = System.currentTimeMillis() - 8500
                              withContext(Dispatchers.Main) {
                                  availableMatches.removeAll { it.lastBeaconMs < cutoff }
                              }
                          }
                      } catch (_: Exception) {
                          udpListenerStarted = false
                      } finally {
                          try { listenSock?.close() } catch (_: Exception) {}
                      }
                  }
              }

              fun registerDiscoveredHost(title: String, ip: String, port: Int) {
                  val now = System.currentTimeMillis()
                  val idx = availableMatches.indexOfFirst { it.hostAddress == ip }
                  val info = HostedMatchInfo(title, ip, port, now)
                  if (idx >= 0) availableMatches[idx] = info else availableMatches.add(info)
              }

              fun disconnectSession(ctx: Context? = null) {
                  beaconJobRef?.cancel()
                  serverAcceptJobRef?.cancel()
                  heartbeatJobRef?.cancel()
                  try { activeSocketRef?.close() } catch (_: Exception) {}
                  try { tcpServerRef?.close() } catch (_: Exception) {}
                  activeSocketRef = null
                  tcpServerRef = null
                  socketWriterRef = null
                  isHostingRoom = false
                  matchConnected = false
                  pickedSquare = null
                  legalMoves = emptyList()
                  if (ctx != null) updateBgService(ctx, "Idle", active = false)
              }

              fun applyLocalOrRemoteMove(r0: Int, c0: Int, r1: Int, c1: Int, sendOverNetwork: Boolean) {
                  val res = LanChessRules.executeMove(boardState, r0, c0, r1, c1, enPassantTarget)
                  boardState = res.grid
                  enPassantTarget = res.nextEpTarget
                  specialMoveBadge = res.moveTag
                  lastMove = MoveRecord(r0, c0, r1, c1)
                  lightTurnNow = !lightTurnNow
                  pickedSquare = null
                  legalMoves = emptyList()
                  boardRevision++
                  val moveLabel = res.moveTag ?: if (lightTurnNow) "White to Move" else "Black to Move"
                  statusBanner = moveLabel
                  if (sendOverNetwork && matchConnected) {
                      engineScope.launch {
                          try { socketWriterRef?.println("MOVE:$r0:$c0:$r1:$c1") } catch (_: Exception) {}
                      }
                  }
              }

              fun handleSquareTap(r: Int, c: Int) {
                  if (r !in 0..7 || c !in 0..7) return
                  val canMoveNow = !matchConnected || (lightTurnNow == localPlaysLight)
                  if (!canMoveNow) return

                  val currentPick = pickedSquare
                  if (currentPick != null) {
                      val r0 = currentPick.first
                      val c0 = currentPick.second
                      val selPiece = boardState[r0][c0]

                      // Direct legal destination tap (includes normal moves, En Passant diagonal, and 2-square Castling)
                      if (legalMoves.any { it.first == r && it.second == c }) {
                          applyLocalOrRemoteMove(r0, c0, r, c, sendOverNetwork = true)
                          return
                      }

                      // Also allow Castling by tapping the friendly Rook after selecting the King!
                      if (selPiece != null && selPiece.kind == 'K' && r == r0) {
                          if (c == 7 && legalMoves.any { it.first == r0 && it.second == 6 }) {
                              applyLocalOrRemoteMove(r0, c0, r0, 6, sendOverNetwork = true)
                              return
                          }
                          if (c == 0 && legalMoves.any { it.first == r0 && it.second == 2 }) {
                              applyLocalOrRemoteMove(r0, c0, r0, 2, sendOverNetwork = true)
                              return
                          }
                      }
                  }

                  val tappedPiece = boardState[r][c]
                  if (tappedPiece != null && tappedPiece.isLight == lightTurnNow) {
                      pickedSquare = Pair(r, c)
                      legalMoves = LanChessRules.validTargetsFor(boardState, r, c, enPassantTarget)
                      boardRevision++
                  } else {
                      pickedSquare = null
                      legalMoves = emptyList()
                      boardRevision++
                  }
              }

              fun resetBoard(sendOverNetwork: Boolean) {
                  boardState = LanChessRules.freshGrid()
                  enPassantTarget = null
                  lightTurnNow = true
                  pickedSquare = null
                  legalMoves = emptyList()
                  lastMove = null
                  specialMoveBadge = null
                  boardRevision++
                  statusBanner = "New Match • White to Move"
                  if (sendOverNetwork && matchConnected) {
                      engineScope.launch {
                          try { socketWriterRef?.println("RESET") } catch (_: Exception) {}
                      }
                  }
              }

              fun toggleLanFileShare(ctx: Context, enable: Boolean) {
                  lanShareEnabled = enable
                  httpShareJobRef?.cancel()
                  try { httpShareServerRef?.close() } catch (_: Exception) {}
                  httpShareServerRef = null
                  if (!enable) {
                      statusBanner = "LAN Share disabled"
                      return
                  }
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  statusBanner = "LAN Share ON • Scan QR or open http://${endpoint.ip}:45480"
                  httpShareJobRef = engineScope.launch {
                      try {
                          val server = ServerSocket()
                          server.reuseAddress = true
                          server.bind(InetSocketAddress("0.0.0.0", 45480))
                          httpShareServerRef = server
                          while (isActive && lanShareEnabled) {
                              val client = server.accept()
                              launch {
                                  handleHttpShareClient(ctx, client)
                              }
                          }
                      } catch (_: Exception) {
                          withContext(Dispatchers.Main) {
                              lanShareEnabled = false
                          }
                      }
                  }
              }

              fun setCustomShareUri(ctx: Context, uri: Uri?) {
                  sharedCustomUri = uri
                  if (uri == null) {
                      sharedFileName = "Multi-Chess-V1.6-ACE.apk"
                      return
                  }
                  var resolvedName = "Shared-File.bin"
                  try {
                      ctx.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIdx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIdx >= 0 && cursor.moveToFirst()) {
                              resolvedName = cursor.getString(nameIdx) ?: resolvedName
                          }
                      }
                  } catch (_: Exception) {}
                  sharedFileName = resolvedName
              }

              private fun handleHttpShareClient(ctx: Context, sock: Socket) {
                  try {
                      sock.soTimeout = 10000
                      val reader = BufferedReader(InputStreamReader(sock.getInputStream()))
                      val out: OutputStream = sock.getOutputStream()
                      val reqLine = reader.readLine() ?: ""
                      while (true) {
                          val hdr = reader.readLine() ?: break
                          if (hdr.isEmpty()) break
                      }
                      val path = reqLine.split(" ").getOrNull(1) ?: "/"
                      if (path.startsWith("/download")) {
                          val customUri = sharedCustomUri
                          val safeName = sharedFileName.replace('"', '_')
                          if (customUri != null) {
                              val pfd = ctx.contentResolver.openFileDescriptor(customUri, "r")
                              val totalLen = pfd?.statSize ?: -1L
                              pfd?.close()
                              val header = buildString {
                                  append("HTTP/1.1 200 OK\r\n")
                                  append("Content-Type: application/octet-stream\r\n")
                                  append("Content-Disposition: attachment; filename=\"$safeName\"\r\n")
                                  if (totalLen > 0) append("Content-Length: $totalLen\r\n")
                                  append("Connection: close\r\n\r\n")
                              }
                              out.write(header.toByteArray())
                              ctx.contentResolver.openInputStream(customUri)?.use { input ->
                                  val buf = ByteArray(16384)
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n <= 0) break
                                      out.write(buf, 0, n)
                                  }
                              }
                          } else {
                              val apkFile = File(ctx.applicationInfo.sourceDir)
                              val header = buildString {
                                  append("HTTP/1.1 200 OK\r\n")
                                  append("Content-Type: application/vnd.android.package-archive\r\n")
                                  append("Content-Disposition: attachment; filename=\"Multi-Chess-V1.6-ACE.apk\"\r\n")
                                  append("Content-Length: ${apkFile.length()}\r\n")
                                  append("Connection: close\r\n\r\n")
                              }
                              out.write(header.toByteArray())
                              FileInputStream(apkFile).use { input ->
                                  val buf = ByteArray(16384)
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n <= 0) break
                                      out.write(buf, 0, n)
                                  }
                              }
                          }
                          out.flush()
