          @Composable
          fun QrCodeCanvas(content: String, modifier: Modifier = Modifier) {
              val matrix = remember(content) {
                  try {
                      QRCodeWriter().encode(content, BarcodeFormat.QR_CODE, 33, 33)
                  } catch (_: Exception) {
                      null
                  }
              }
              Canvas(modifier = modifier) {
                  val m = matrix ?: return@Canvas
                  val cols = m.width
                  val rows = m.height
                  val cellW = size.width / cols.toFloat()
                  val cellH = size.height / rows.toFloat()
                  for (y in 0 until rows) {
                      for (x in 0 until cols) {
                          if (m.get(x, y)) {
                              drawRect(
                                  color = Color(0xFF141312),
                                  topLeft = Offset(x * cellW, y * cellH),
                                  size = Size(cellW + 0.6f, cellH + 0.6f)
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChessCom2DBoard(
              grid: Array<Array<ChessCellPiece?>>,
              boardRevision: Int,
              perspectiveLight: Boolean,
              selectedCell: Pair<Int, Int>?,
              highlightedCells: List<Pair<Int, Int>>,
              epTargetCell: Pair<Int, Int>?,
              lastMove: MoveRecord?,
              checkedKingCell: Pair<Int, Int>?
          ) {
              val coordPaint = remember {
                  android.graphics.Paint().apply {
                      isAntiAlias = true
                      isFakeBoldText = true
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .aspectRatio(1f)
                      .shadow(10.dp, RoundedCornerShape(10.dp))
                      .clip(RoundedCornerShape(10.dp))
                      .border(2.dp, GlossBorderLight, RoundedCornerShape(10.dp))
              ) {
                  Canvas(
                      modifier = Modifier.fillMaxSize()
                  ) {
                      // Read boardRevision inside DrawScope so Compose always invalidates Canvas on every tap/move
                      val rev = boardRevision
                      if (rev < 0) return@Canvas
                      val cellW = size.width / 8f
                      val cellH = size.height / 8f
                      coordPaint.textSize = cellW * 0.20f

                      for (visR in 0..7) {
                          for (visC in 0..7) {
                              val r = if (perspectiveLight) visR else 7 - visR
                              val c = if (perspectiveLight) visC else 7 - visC
                              val left = visC * cellW
                              val top = visR * cellH
                              val isLightSq = (r + c) % 2 == 0

                              val isSelected = (selectedCell?.first == r && selectedCell.second == c)
                              val isLastMove = (lastMove != null && ((lastMove.r0 == r && lastMove.c0 == c) || (lastMove.r1 == r && lastMove.c1 == c)))
                              val isKingCheck = (checkedKingCell?.first == r && checkedKingCell.second == c)

                              val sqColor = when {
                                  isKingCheck -> Color(0xFFE64A45)
                                  isSelected || isLastMove -> if (isLightSq) ChessHighlightLight else ChessHighlightDark
                                  isLightSq -> ChessBoardLight
                                  else -> ChessBoardDark
                              }

                              // 1. Flat 2D Chess.com Square with subtle top glossy bevel
                              drawRect(
                                  color = sqColor,
                                  topLeft = Offset(left, top),
                                  size = Size(cellW, cellH)
                              )
                              drawRect(
                                  color = Color(0x12FFFFFF),
                                  topLeft = Offset(left, top),
                                  size = Size(cellW, cellH * 0.22f)
                              )

                              // 2. Algebraic Coordinates (1-8 on left file, a-h on bottom rank)
                              val labelArgb = if (isLightSq) {
                                  android.graphics.Color.parseColor("#769656")
                              } else {
                                  android.graphics.Color.parseColor("#EEEED2")
                              }
                              coordPaint.color = labelArgb

                              if (visC == 0) {
                                  val rankLabel = (8 - r).toString()
                                  coordPaint.textAlign = android.graphics.Paint.Align.LEFT
                                  drawContext.canvas.nativeCanvas.drawText(
                                      rankLabel,
                                      left + cellW * 0.07f,
                                      top + cellH * 0.24f,
                                      coordPaint
                                  )
                              }
                              if (visR == 7) {
                                  val fileLabel = ('a' + c).toString()
                                  coordPaint.textAlign = android.graphics.Paint.Align.RIGHT
                                  drawContext.canvas.nativeCanvas.drawText(
                                      fileLabel,
                                      left + cellW * 0.93f,
                                      top + cellH * 0.92f,
                                      coordPaint
                                  )
                              }

                              // 3. Chess.com Neo Vector Piece
                              val piece = grid[r][c]
                              if (piece != null) {
                                  NeoPieceDrawer.drawPiece(
                                      scope = this,
                                      kind = piece.kind,
                                      isLight = piece.isLight,
                                      cx = left + cellW / 2f,
                                      cy = top + cellH / 2f,
                                      cellDim = minOf(cellW, cellH)
                                  )
                              }

                              // 4. Legal Move Dot, Capture Ring, or Special Castling/En-Passant Ring
                              if (highlightedCells.contains(Pair(r, c))) {
                                  val cx = left + cellW / 2f
                                  val cy = top + cellH / 2f
                                  val selPiece = selectedCell?.let { grid[it.first][it.second] }
                                  val isCastleTarget = selPiece?.kind == 'K' && selectedCell != null && abs(c - selectedCell.second) == 2
                                  val isEnPassantCapture = selPiece?.kind == 'P' && epTargetCell == Pair(r, c) && piece == null

                                  if (piece != null || isEnPassantCapture) {
                                      // Capture ring (also highlights empty square during En Passant capture!)
                                      drawCircle(
                                          color = Color(0x48000000),
                                          radius = minOf(cellW, cellH) * 0.42f,
                                          center = Offset(cx, cy),
                                          style = Stroke(width = minOf(cellW, cellH) * 0.09f)
                                      )
                                  } else if (isCastleTarget) {
                                      // Special double-ring indicator for Castling square (O-O / O-O-O)
                                      drawCircle(
                                          color = Color(0x55000000),
                                          radius = minOf(cellW, cellH) * 0.22f,
                                          center = Offset(cx, cy)
                                      )
                                      drawCircle(
                                          color = Color(0x40000000),
                                          radius = minOf(cellW, cellH) * 0.38f,
                                          center = Offset(cx, cy),
                                          style = Stroke(width = minOf(cellW, cellH) * 0.06f)
                                      )
                                  } else {
                                      // Standard legal move dot
                                      drawCircle(
                                          color = Color(0x38000000),
                                          radius = minOf(cellW, cellH) * 0.16f,
                                          center = Offset(cx, cy)
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // Direct 8x8 Clickable Touch Matrix Overlay (100% immune to pointerInput closure bugs!)
                  Column(modifier = Modifier.fillMaxSize()) {
                      for (visR in 0..7) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(1f)
                          ) {
                              for (visC in 0..7) {
                                  val boardRow = if (perspectiveLight) visR else 7 - visR
                                  val boardCol = if (perspectiveLight) visC else 7 - visC
                                  Box(
                                      modifier = Modifier
                                          .weight(1f)
                                          .fillMaxHeight()
                                          .clickable(
                                              interactionSource = remember { MutableInteractionSource() },
                                              indication = null
                                          ) {
                                              LanSessionEngine.handleSquareTap(boardRow, boardCol)
                                          }
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF_KOTLIN

