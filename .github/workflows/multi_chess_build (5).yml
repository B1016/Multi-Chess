                          out.write(bodyBytes)
                          out.flush()
                      }
                  } catch (_: Exception) {
                  } finally {
                      try { sock.close() } catch (_: Exception) {}
                  }
              }

              private fun handleIncomingPacket(line: String) {
                  val parts = line.trim().split(":")
                  if (parts.isEmpty()) return
                  when (parts[0]) {
                      "MOVE" -> if (parts.size >= 5) {
                          val r0 = parts[1].toIntOrNull() ?: return
                          val c0 = parts[2].toIntOrNull() ?: return
                          val r1 = parts[3].toIntOrNull() ?: return
                          val c1 = parts[4].toIntOrNull() ?: return
                          applyLocalOrRemoteMove(r0, c0, r1, c1, sendOverNetwork = false)
                      }
                      "RESET" -> {
                          resetBoard(sendOverNetwork = false)
                      }
                  }
              }

              private fun bindMatchSocket(
                  ctx: Context,
                  sock: Socket,
                  writer: PrintWriter,
                  reader: BufferedReader,
                  amHost: Boolean,
                  title: String
              ) {
                  engineScope.launch {
                      try {
                          sock.tcpNoDelay = true
                          sock.keepAlive = true
                          val remoteIp = sock.inetAddress?.hostAddress ?: "LAN Peer"
                          withContext(Dispatchers.Main) {
                              activeSocketRef = sock
                              socketWriterRef = writer
                              localPlaysLight = amHost
                              lightTurnNow = true
                              boardState = LanChessRules.freshGrid()
                              enPassantTarget = null
                              lastMove = null
                              specialMoveBadge = null
                              pickedSquare = null
                              legalMoves = emptyList()
                              matchConnected = true
                              opponentLabel = "$title ($remoteIp)"
                              statusBanner = if (amHost) "Connected • Playing as White" else "Connected • Playing as Black"
                              updateBgService(ctx, "In LAN Match with $title ($remoteIp)", active = true)
                          }
                          heartbeatJobRef?.cancel()
                          heartbeatJobRef = engineScope.launch {
                              while (isActive && sock.isConnected && !sock.isClosed) {
                                  delay(4000)
                                  try { writer.println("PING") } catch (_: Exception) {}
                              }
                          }
                          while (sock.isConnected && !sock.isClosed) {
                              val incoming = reader.readLine() ?: break
                              if (incoming == "PING") continue
                              withContext(Dispatchers.Main) {
                                  handleIncomingPacket(incoming)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          withContext(Dispatchers.Main) {
                              if (matchConnected) {
                                  disconnectSession(ctx)
                                  statusBanner = "Opponent left the match"
                              }
                          }
                      }
                  }
              }

              fun startHostingTable(ctx: Context) {
                  disconnectSession(ctx)
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  val cleanTitle = hostRoomTitle.trim().ifEmpty { "Chess.com LAN" }.replace("|", " ")
                  isHostingRoom = true
                  statusBanner = "Hosting \"$cleanTitle\" • Code: ${endpoint.roomCode} (${endpoint.ip})"
                  updateBgService(ctx, "Hosting \"$cleanTitle\" on Code ${endpoint.roomCode} (${endpoint.ip})", active = true)

                  beaconJobRef = engineScope.launch {
                      var udpSock: DatagramSocket? = null
                      try {
                          udpSock = DatagramSocket()
                          udpSock.broadcast = true
                          val targets = listOf(
                              endpoint.broadcastIp,
                              "255.255.255.255",
                              "192.168.43.255",
                              "192.168.234.255"
                          ).distinct()
                          while (isActive && isHostingRoom && !matchConnected) {
                              val payload = "MULTICHESS|$cleanTitle|${endpoint.ip}|45455".toByteArray()
                              for (t in targets) {
                                  try {
                                      val pkt = DatagramPacket(payload, payload.size, InetAddress.getByName(t), 45454)
                                      udpSock.send(pkt)
                                  } catch (_: Exception) {}
                              }
                              delay(800)
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { udpSock?.close() } catch (_: Exception) {}
                      }
                  }

                  serverAcceptJobRef = engineScope.launch {
                      try {
                          val server = ServerSocket()
                          server.reuseAddress = true
                          server.bind(InetSocketAddress("0.0.0.0", 45455))
                          tcpServerRef = server
                          while (isActive && isHostingRoom && !matchConnected) {
                              val client = server.accept()
                              launch {
                                  try {
                                      client.soTimeout = 3500
                                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                                      val writer = PrintWriter(client.getOutputStream(), true)
                                      val firstLine = reader.readLine() ?: ""
                                      if (firstLine.startsWith("QUERY_ROOM")) {
                                          writer.println("ROOM_INFO|$cleanTitle|${endpoint.ip}|45455")
                                          client.close()
                                      } else if (firstLine.startsWith("JOIN_MATCH")) {
                                          client.soTimeout = 0
                                          writer.println("MATCH_START|$cleanTitle")
                                          beaconJobRef?.cancel()
                                          try { server.close() } catch (_: Exception) {}
                                          bindMatchSocket(ctx, client, writer, reader, amHost = true, title = cleanTitle)
                                      } else {
                                          client.close()
                                      }
                                  } catch (_: Exception) {
                                      try { client.close() } catch (_: Exception) {}
                                  }
                              }
                          }
                      } catch (_: Exception) {
                          withContext(Dispatchers.Main) {
                              if (!matchConnected) isHostingRoom = false
                          }
                      }
                  }
              }

              fun scanSubnetForHosts() {
                  if (isScanningLan) return
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  isScanningLan = true
                  engineScope.launch {
                      try {
                          val prefix = endpoint.subnetPrefix
                          val priorityIps = mutableListOf(
                              "${prefix}1",
                              "192.168.43.1",
                              "192.168.234.1"
                          )
                          for (i in 1..254) {
                              val candidate = "$prefix$i"
                              if (candidate != endpoint.ip && !priorityIps.contains(candidate)) {
                                  priorityIps.add(candidate)
                              }
                          }
                          for (batch in priorityIps.chunked(48)) {
                              val jobs = batch.map { targetIp ->
                                  async {
                                      var probe: Socket? = null
                                      try {
                                          probe = Socket()
                                          probe.connect(InetSocketAddress(targetIp, 45455), 260)
                                          probe.soTimeout = 380
                                          val writer = PrintWriter(probe.getOutputStream(), true)
                                          val reader = BufferedReader(InputStreamReader(probe.getInputStream()))
                                          writer.println("QUERY_ROOM")
                                          val reply = reader.readLine() ?: ""
                                          if (reply.startsWith("ROOM_INFO|")) {
                                              val segs = reply.split("|")
                                              if (segs.size >= 4) {
                                                  val rTitle = segs[1]
                                                  val rPort = segs[3].toIntOrNull() ?: 45455
                                                  withContext(Dispatchers.Main) {
                                                      registerDiscoveredHost(rTitle, targetIp, rPort)
                                                  }
                                              }
                                          }
                                      } catch (_: Exception) {
                                      } finally {
                                          try { probe?.close() } catch (_: Exception) {}
                                      }
                                  }
                              }
                              jobs.awaitAll()
                          }
                      } finally {
                          withContext(Dispatchers.Main) {
                              isScanningLan = false
                          }
                      }
                  }
              }

              fun joinHostedTable(ctx: Context, rawTarget: String, targetPort: Int, fallbackTitle: String) {
                  val trimmed = rawTarget.trim()
                  if (trimmed.isEmpty()) return
                  endpoint = NetworkAddressHelper.findBestLanEndpoint()
                  val resolvedIp = if (trimmed.all { it.isDigit() } && trimmed.length <= 3) {
                      "${endpoint.subnetPrefix}$trimmed"
                  } else {
                      trimmed
                  }
                  disconnectSession(ctx)
                  statusBanner = "Connecting to $resolvedIp:$targetPort..."
                  engineScope.launch {
                      try {
                          val sock = Socket()
                          sock.connect(InetSocketAddress(resolvedIp, targetPort), 3500)
                          sock.soTimeout = 4000
                          val writer = PrintWriter(sock.getOutputStream(), true)
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream()))
                          writer.println("JOIN_MATCH|Challenger")
                          val handshake = reader.readLine() ?: ""
                          if (handshake.startsWith("MATCH_START")) {
                              val title = handshake.split("|").getOrNull(1) ?: fallbackTitle
                              sock.soTimeout = 0
                              bindMatchSocket(ctx, sock, writer, reader, amHost = false, title = title)
                          } else {
                              sock.close()
                              withContext(Dispatchers.Main) {
                                  statusBanner = "Host did not accept match handshake"
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              statusBanner = "Cannot reach $resolvedIp (${e.localizedMessage ?: "timeout"})"
                          }
                      }
                  }
              }
          }

