          val ChessBoardDark = Color(0xFF769656)
          val ChessHighlightLight = Color(0xFFF6F669)
          val ChessHighlightDark = Color(0xFFBACA44)
          val ChessTextMuted = Color(0xFFA09E9B)
          val GlossBorderLight = Color(0x33FFFFFF)

          data class HostedMatchInfo(
              val roomTitle: String,
              val hostAddress: String,
              val tcpPort: Int,
              val lastBeaconMs: Long
          )

          data class MoveRecord(
              val r0: Int,
              val c0: Int,
              val r1: Int,
              val c1: Int
          )

          data class ChessCellPiece(
              val kind: Char, // K, Q, R, B, N, P
              val isLight: Boolean,
              val hasMoved: Boolean = false
          ) {
              fun pointValue(): Int = when (kind) {
                  'Q' -> 9
                  'R' -> 5
                  'B', 'N' -> 3
                  'P' -> 1
                  else -> 0
              }
          }

          data class MoveExecutionResult(
              val grid: Array<Array<ChessCellPiece?>>,
              val nextEpTarget: Pair<Int, Int>?,
              val moveTag: String?
          )

          object LanChessRules {
              fun freshGrid(): Array<Array<ChessCellPiece?>> {
                  val grid = Array(8) { arrayOfNulls<ChessCellPiece>(8) }
                  val majorRow = charArrayOf('R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R')
                  for (c in 0..7) {
                      grid[0][c] = ChessCellPiece(majorRow[c], isLight = false, hasMoved = false)
                      grid[1][c] = ChessCellPiece('P', isLight = false, hasMoved = false)
                      grid[6][c] = ChessCellPiece('P', isLight = true, hasMoved = false)
                      grid[7][c] = ChessCellPiece(majorRow[c], isLight = true, hasMoved = false)
                  }
                  return grid
              }

              fun cloneGrid(src: Array<Array<ChessCellPiece?>>): Array<Array<ChessCellPiece?>> {
                  return Array(8) { r -> Array(8) { c -> src[r][c] } }
              }

              private fun pathClear(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int, r1: Int, c1: Int): Boolean {
                  val stepR = (r1 - r0).coerceIn(-1, 1)
                  val stepC = (c1 - c0).coerceIn(-1, 1)
                  var curR = r0 + stepR
                  var curC = c0 + stepC
                  while (curR != r1 || curC != c1) {
                      if (grid[curR][curC] != null) return false
                      curR += stepR
                      curC += stepC
                  }
                  return true
              }

              fun isSquareAttackedBy(
                  grid: Array<Array<ChessCellPiece?>>,
                  targetR: Int,
                  targetC: Int,
                  attackerIsLight: Boolean
              ): Boolean {
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c] ?: continue
                          if (p.isLight != attackerIsLight) continue
                          val dR = targetR - r
                          val dC = targetC - c
                          val aR = abs(dR)
                          val aC = abs(dC)
                          val hits = when (p.kind) {
                              'P' -> {
                                  val fwd = if (p.isLight) -1 else 1
                                  dR == fwd && aC == 1
                              }
                              'R' -> (r == targetR || c == targetC) && pathClear(grid, r, c, targetR, targetC)
                              'N' -> (aR == 2 && aC == 1) || (aR == 1 && aC == 2)
                              'B' -> (aR == aC && aR > 0) && pathClear(grid, r, c, targetR, targetC)
                              'Q' -> ((r == targetR || c == targetC || aR == aC) && (aR + aC > 0)) &&
                                  pathClear(grid, r, c, targetR, targetC)
                              'K' -> aR <= 1 && aC <= 1 && (aR + aC > 0)
                              else -> false
                          }
                          if (hits) return true
                      }
                  }
                  return false
              }

              fun findKingSquare(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Pair<Int, Int>? {
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c]
                          if (p != null && p.isLight == lightSide && p.kind == 'K') {
                              return Pair(r, c)
                          }
                      }
                  }
                  return null
              }

              fun kingThreatened(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Boolean {
                  val kingPos = findKingSquare(grid, lightSide) ?: return true
                  return isSquareAttackedBy(grid, kingPos.first, kingPos.second, !lightSide)
              }

              fun executeMove(
                  grid: Array<Array<ChessCellPiece?>>,
                  r0: Int,
                  c0: Int,
                  r1: Int,
                  c1: Int,
                  currentEpTarget: Pair<Int, Int>?
              ): MoveExecutionResult {
                  val next = cloneGrid(grid)
                  val mover = next[r0][c0] ?: return MoveExecutionResult(next, null, null)
                  var nextEp: Pair<Int, Int>? = null
                  var specialTag: String? = null

                  // 1. Check En Passant capture
                  if (mover.kind == 'P' && c0 != c1 && next[r1][c1] == null && currentEpTarget == Pair(r1, c1)) {
                      next[r0][c1] = null
                      specialTag = "En Passant!"
                  }

                  // 2. Check Pawn double-step (creates En Passant target for next turn)
                  if (mover.kind == 'P' && abs(r1 - r0) == 2) {
                      nextEp = Pair((r0 + r1) / 2, c0)
                  }

                  // 3. Check Castling (King moves 2 files horizontally)
                  if (mover.kind == 'K' && abs(c1 - c0) == 2) {
                      if (c1 == 6) {
                          // Kingside O-O: move Rook from file 7 to file 5
                          val rook = next[r0][7]
                          next[r0][5] = rook?.copy(hasMoved = true) ?: ChessCellPiece('R', mover.isLight, true)
                          next[r0][7] = null
                          specialTag = "Castled Kingside (O-O)"
                      } else if (c1 == 2) {
                          // Queenside O-O-O: move Rook from file 0 to file 3
                          val rook = next[r0][0]
                          next[r0][3] = rook?.copy(hasMoved = true) ?: ChessCellPiece('R', mover.isLight, true)
                          next[r0][0] = null
                          specialTag = "Castled Queenside (O-O-O)"
                      }
                  }

                  // 4. Move piece & auto-promote Pawn reaching back rank
                  val promoted = mover.kind == 'P' && (r1 == 0 || r1 == 7)
                  next[r1][c1] = if (promoted) {
                      specialTag = "Promoted to Queen!"
                      ChessCellPiece('Q', mover.isLight, hasMoved = true)
                  } else {
                      mover.copy(hasMoved = true)
                  }
                  next[r0][c0] = null

                  return MoveExecutionResult(next, nextEp, specialTag)
              }

              fun canReach(
                  grid: Array<Array<ChessCellPiece?>>,
                  r0: Int,
                  c0: Int,
                  r1: Int,
                  c1: Int,
                  epTarget: Pair<Int, Int>? = null
              ): Boolean {
                  if (r1 !in 0..7 || c1 !in 0..7 || (r0 == r1 && c0 == c1)) return false
                  val mover = grid[r0][c0] ?: return false
                  val dest = grid[r1][c1]
                  if (dest != null && dest.isLight == mover.isLight) return false

                  val dR = r1 - r0
                  val dC = c1 - c0
                  val aR = abs(dR)
                  val aC = abs(dC)

                  val geomOk = when (mover.kind) {
                      'P' -> {
                          val fwd = if (mover.isLight) -1 else 1
                          val homeRow = if (mover.isLight) 6 else 1
                          if (dC == 0 && dest == null) {
                              dR == fwd || (r0 == homeRow && dR == 2 * fwd && grid[r0 + fwd][c0] == null)
                          } else if (aC == 1 && dR == fwd) {
                              (dest != null && dest.isLight != mover.isLight) ||
                                  (dest == null && epTarget == Pair(r1, c1))
                          } else false
                      }
                      'R' -> (r0 == r1 || c0 == c1) && pathClear(grid, r0, c0, r1, c1)
                      'N' -> (aR == 2 && aC == 1) || (aR == 1 && aC == 2)
                      'B' -> (aR == aC) && pathClear(grid, r0, c0, r1, c1)
                      'Q' -> (r0 == r1 || c0 == c1 || aR == aC) && pathClear(grid, r0, c0, r1, c1)
                      'K' -> {
                          if (aR <= 1 && aC <= 1) {
                              true
                          } else if (dR == 0 && aC == 2 && !mover.hasMoved && !kingThreatened(grid, mover.isLight)) {
                              val homeRow = if (mover.isLight) 7 else 0
                              if (r0 != homeRow || c0 != 4) {
                                  false
                              } else if (c1 == 6) {
                                  // Kingside Castling (O-O)
                                  val rook = grid[homeRow][7]
                                  rook != null && rook.kind == 'R' && rook.isLight == mover.isLight && !rook.hasMoved &&
                                      grid[homeRow][5] == null && grid[homeRow][6] == null &&
                                      !isSquareAttackedBy(grid, homeRow, 5, !mover.isLight) &&
                                      !isSquareAttackedBy(grid, homeRow, 6, !mover.isLight)
                              } else if (c1 == 2) {
                                  // Queenside Castling (O-O-O)
                                  val rook = grid[homeRow][0]
                                  rook != null && rook.kind == 'R' && rook.isLight == mover.isLight && !rook.hasMoved &&
                                      grid[homeRow][1] == null && grid[homeRow][2] == null && grid[homeRow][3] == null &&
                                      !isSquareAttackedBy(grid, homeRow, 3, !mover.isLight) &&
                                      !isSquareAttackedBy(grid, homeRow, 2, !mover.isLight)
                              } else false
                          } else false
                      }
                      else -> false
                  }
                  if (!geomOk) return false

                  val sim = executeMove(grid, r0, c0, r1, c1, epTarget)
                  return !kingThreatened(sim.grid, mover.isLight)
              }

              fun validTargetsFor(
                  grid: Array<Array<ChessCellPiece?>>,
                  r0: Int,
                  c0: Int,
                  epTarget: Pair<Int, Int>?
              ): List<Pair<Int, Int>> {
                  val res = mutableListOf<Pair<Int, Int>>()
                  for (r in 0..7) {
                      for (c in 0..7) {
                          if (canReach(grid, r0, c0, r, c, epTarget)) res.add(Pair(r, c))
                      }
                  }
                  return res
              }

              fun hasAnyLegalMove(
                  grid: Array<Array<ChessCellPiece?>>,
                  lightSide: Boolean,
                  epTarget: Pair<Int, Int>?
              ): Boolean {
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c]
                          if (p != null && p.isLight == lightSide) {
                              if (validTargetsFor(grid, r, c, epTarget).isNotEmpty()) return true
                          }
                      }
                  }
                  return false
              }

              fun materialDiff(grid: Array<Array<ChessCellPiece?>>): Int {
                  var whitePts = 0
                  var blackPts = 0
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c] ?: continue
                          if (p.isLight) whitePts += p.pointValue() else blackPts += p.pointValue()
                      }
                  }
                  return whitePts - blackPts
              }
          }

          object NeoPieceDrawer {
              fun drawPiece(scope: DrawScope, kind: Char, isLight: Boolean, cx: Float, cy: Float, cellDim: Float) {
                  val fillCol = if (isLight) Color(0xFFFAF9F5) else Color(0xFF282623)
                  val strokeCol = if (isLight) Color(0xFF23211E) else Color(0xFF100F0D)
                  val innerAccent = if (isLight) Color(0xFF23211E) else Color(0xFF8A8680)
                  val glossTint = if (isLight) Color(0x77FFFFFF) else Color(0x30FFFFFF)
                  val u = cellDim * 0.01f
                  val left = cx - 50f * u
                  val top = cy - 50f * u
                  val outlineStroke = Stroke(width = 4.2f * u, cap = StrokeCap.Round, join = StrokeJoin.Round)
                  val detailStroke = Stroke(width = 3.0f * u, cap = StrokeCap.Round, join = StrokeJoin.Round)

                  // Soft ground shadow
                  scope.drawOval(
                      color = Color(0x38000000),
                      topLeft = Offset(left + 15f * u, top + 82f * u),
                      size = Size(70f * u, 9.5f * u)
                  )

                  val body = Path()
                  when (kind) {
                      'P' -> {
                          body.moveTo(left + 22f * u, top + 84f * u)
                          body.lineTo(left + 78f * u, top + 84f * u)
                          body.lineTo(left + 74f * u, top + 75f * u)
                          body.cubicTo(left + 64f * u, top + 68f * u, left + 60f * u, top + 54f * u, left + 58f * u, top + 46f * u)
                          body.lineTo(left + 42f * u, top + 46f * u)
                          body.cubicTo(left + 40f * u, top + 54f * u, left + 36f * u, top + 68f * u, left + 26f * u, top + 75f * u)
                          body.close()
                          scope.drawPath(body, fillCol, style = Fill)
                          scope.drawPath(body, strokeCol, style = outlineStroke)

                          scope.drawCircle(color = fillCol, radius = 14.5f * u, center = Offset(cx, top + 31f * u))
