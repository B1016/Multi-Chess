                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      OutlinedTextField(
                                          value = LanSessionEngine.quickJoinInput,
                                          onValueChange = { LanSessionEngine.quickJoinInput = it },
                                          label = { Text("Room Code (e.g. ${endpoint.roomCode}) or Host IP", fontSize = 11.sp) },
                                          singleLine = true,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Spacer(modifier = Modifier.width(10.dp))
                                      ChessComGlossyButton(
                                          text = "Join Game",
                                          isDanger = false,
                                          onClick = {
                                              LanSessionEngine.joinHostedTable(context, LanSessionEngine.quickJoinInput, 45455, "LAN Opponent")
                                          }
                                      )
                                  }
                              }
                          }
                      }

                      // TOP PLAYER BAR (Opponent + Special Move Notification Pill)
                      val topIsLight = !perspectiveLight
                      val topAdv = if (topIsLight) matDiff else -matDiff
                      ChessComPlayerBar(
                          name = if (matchConnected) LanSessionEngine.opponentLabel else if (topIsLight) "White Opponent" else "Black Opponent",
                          isLightPiece = topIsLight,
                          isTurnActive = (lightTurnNow == topIsLight),
                          materialAdvantage = topAdv,
                          rightStatusText = specialMoveBadge ?: if (lightTurnNow == topIsLight) "Opponent Turn" else "Waiting"
                      )

                      // PERFECT 2D GLOSSY CHESS.COM BOARD (With Castling & En Passant Indicators)
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f, fill = false),
                          contentAlignment = Alignment.Center
                      ) {
                          ChessCom2DBoard(
                              grid = boardState,
                              boardRevision = boardRevision,
                              perspectiveLight = perspectiveLight,
                              selectedCell = pickedSquare,
                              highlightedCells = legalMoves,
                              epTargetCell = epTarget,
                              lastMove = lastMove,
                              checkedKingCell = checkedKingSquare
                          )
                      }

                      // BOTTOM PLAYER BAR + OPTIMIZED ACTION BUTTONS
                      val botIsLight = perspectiveLight
                      val botAdv = if (botIsLight) matDiff else -matDiff
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Box(modifier = Modifier.weight(1f)) {
                              ChessComPlayerBar(
                                  name = if (matchConnected) "You (${if (botIsLight) "White" else "Black"})" else "You (Practice / Local)",
                                  isLightPiece = botIsLight,
                                  isTurnActive = (lightTurnNow == botIsLight),
                                  materialAdvantage = botAdv,
                                  rightStatusText = turnBadgeText
                              )
                          }
                          Spacer(modifier = Modifier.width(8.dp))
                          ChessComGlossySmallButton(
                              text = "New Board",
                              onClick = { LanSessionEngine.resetBoard(sendOverNetwork = true) }
                          )
                          if (matchConnected) {
                              Spacer(modifier = Modifier.width(6.dp))
                              ChessComGlossySmallButton(
                                  text = "Leave",
                                  isDanger = true,
                                  onClick = {
                                      LanSessionEngine.disconnectSession(context)
                                      LanSessionEngine.statusBanner = "Left active match"
                                  }
                              )
                          }
                      }
                  }

                  // GLOSSY CHESS.COM BOTTOM NAVIGATION BAR (Strictly ONLY "Host" and "Play" Tabs)
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(
                              Brush.verticalGradient(
                                  listOf(Color(0xFF282623), ChessNavDark)
                              )
                          )
                          .border(width = 0.8.dp, color = GlossBorderLight)
                          .padding(vertical = 7.dp, horizontal = 20.dp),
                      horizontalArrangement = Arrangement.spacedBy(14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      val navItems = listOf(
                          Triple(0, "Host", 'K'),
                          Triple(1, "Play", 'P')
                      )
                      navItems.forEach { (idx, label, iconKind) ->
                          val selected = activeTab == idx
                          val tabBg = if (selected) {
                              Brush.verticalGradient(listOf(Color(0xFF423F3A), Color(0xFF2D2B28)))
                          } else {
                              Brush.verticalGradient(listOf(Color(0xFF252421), Color(0xFF1D1C19)))
                          }
                          Row(
                              modifier = Modifier
                                  .weight(1f)
                                  .shadow(if (selected) 5.dp else 1.dp, RoundedCornerShape(12.dp))
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(tabBg)
                                  .border(
                                      width = if (selected) 1.2.dp else 0.7.dp,
                                      color = if (selected) ChessGreenBtn else GlossBorderLight,
                                      shape = RoundedCornerShape(12.dp)
                                  )
                                  .clickable { LanSessionEngine.activeTab = idx }
                                  .padding(vertical = 9.dp, horizontal = 14.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Canvas(modifier = Modifier.size(22.dp)) {
                                  NeoPieceDrawer.drawPiece(
                                      this,
                                      kind = iconKind,
                                      isLight = selected,
                                      cx = size.width / 2f,
                                      cy = size.height / 2f,
                                      cellDim = size.width * 0.95f
                                  )
                              }
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(
                                  text = label,
                                  color = if (selected) ChessGreenTop else ChessTextMuted,
                                  fontWeight = FontWeight.ExtraBold,
                                  fontSize = 15.sp
                              )
                          }
                      }
                  }
              }
          }

