name: Build Multi Chess APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  assemble-multi-chess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK and Gradle 8.9
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/g89.zip
          unzip -q /tmp/g89.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Generate Multi Chess Project Structure
        run: |
          mkdir -p app/src/main/java/com/multichess/lan
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MultiChessLAN"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_PROPS

          cat << 'EOF_ROOT_GRADLE' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_ROOT_GRADLE

          cat << 'EOF_APP_GRADLE' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.multichess.lan"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.multichess.lan"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF_APP_GRADLE

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Multi Chess"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_ICON_BG' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E2436"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#2A334D"
                  android:pathData="M54,54m-46,0a46,46 0,1 1,92 0a46,46 0,1 1,-92 0" />
          </vector>
          EOF_ICON_BG

          cat << 'EOF_ICON_FG' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Golden Aura Behind Black King Piece -->
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M51,18h6v6h6v5h-6v6h-6v-6h-6v-5h6z" />
              <!-- Black King Piece Silhouette with Gold Rim -->
              <path
                  android:fillColor="#0A0B0E"
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="1.8"
                  android:pathData="M52,19h4v5h5v4h-5v6h-4v-6h-5v-4h5z M38,36 C38,31 46,31 54,34 C62,31 70,31 70,36 L65,64 L71,70 L71,75 L37,75 L37,70 L43,64 Z M33,77h42v5h-42z M30,84h48v6h-48z" />
              <!-- Subtle Collar Accent on Black King -->
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M43,63h22v2.5h-22z M37,72h34v2h-34z" />
          </vector>
          EOF_ICON_FG

          cat << 'EOF_MIPMAP' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_MIPMAP

          cat << 'EOF_KOTLIN' > app/src/main/java/com/multichess/lan/MainActivity.kt
          package com.multichess.lan

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Wifi
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.*
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.PrintWriter
          import java.net.*
          import kotlin.math.abs

          data class HostedMatchInfo(
              val roomTitle: String,
              val hostAddress: String,
              val tcpPort: Int,
              val lastBeaconMs: Long
          )

          data class ChessCellPiece(
              val kind: Char, // K, Q, R, B, N, P
              val isLight: Boolean
          ) {
              fun glyph(): String = when (kind) {
                  'K' -> "♚"
                  'Q' -> "♛"
                  'R' -> "♜"
                  'B' -> "♝"
                  'N' -> "♞"
                  else -> "♟"
              }
          }

          object LanChessRules {
              fun freshGrid(): Array<Array<ChessCellPiece?>> {
                  val grid = Array(8) { arrayOfNulls<ChessCellPiece>(8) }
                  val majorRow = charArrayOf('R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R')
                  for (c in 0..7) {
                      grid[0][c] = ChessCellPiece(majorRow[c], isLight = false)
                      grid[1][c] = ChessCellPiece('P', isLight = false)
                      grid[6][c] = ChessCellPiece('P', isLight = true)
                      grid[7][c] = ChessCellPiece(majorRow[c], isLight = true)
                  }
                  return grid
              }

              fun cloneGrid(src: Array<Array<ChessCellPiece?>>): Array<Array<ChessCellPiece?>> {
                  return Array(8) { r -> Array(8) { c -> src[r][c] } }
              }

              private fun pathClear(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int, r1: Int, c1: Int): Boolean {
                  val stepR = (r1 - r0).coerceIn(-1, 1)
                  val stepC = (c1 - c0).coerceIn(-1, 1)
                  var curR = r0 + stepR
                  var curC = c0 + stepC
                  while (curR != r1 || curC != c1) {
                      if (grid[curR][curC] != null) return false
                      curR += stepR
                      curC += stepC
                  }
                  return true
              }

              fun canReach(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int, r1: Int, c1: Int, ignoreCheck: Boolean = false): Boolean {
                  if (r1 !in 0..7 || c1 !in 0..7 || (r0 == r1 && c0 == c1)) return false
                  val mover = grid[r0][c0] ?: return false
                  val dest = grid[r1][c1]
                  if (dest != null && dest.isLight == mover.isLight) return false

                  val dR = r1 - r0
                  val dC = c1 - c0
                  val aR = abs(dR)
                  val aC = abs(dC)

                  val geomOk = when (mover.kind) {
                      'P' -> {
                          val fwd = if (mover.isLight) -1 else 1
                          val homeRow = if (mover.isLight) 6 else 1
                          if (dC == 0 && dest == null) {
                              dR == fwd || (r0 == homeRow && dR == 2 * fwd && grid[r0 + fwd][c0] == null)
                          } else if (aC == 1 && dR == fwd) {
                              dest != null && dest.isLight != mover.isLight
                          } else false
                      }
                      'R' -> (r0 == r1 || c0 == c1) && pathClear(grid, r0, c0, r1, c1)
                      'N' -> (aR == 2 && aC == 1) || (aR == 1 && aC == 2)
                      'B' -> (aR == aC) && pathClear(grid, r0, c0, r1, c1)
                      'Q' -> (r0 == r1 || c0 == c1 || aR == aC) && pathClear(grid, r0, c0, r1, c1)
                      'K' -> aR <= 1 && aC <= 1
                      else -> false
                  }
                  if (!geomOk) return false
                  if (ignoreCheck) return true

                  val nextGrid = cloneGrid(grid)
                  nextGrid[r1][c1] = if (mover.kind == 'P' && (r1 == 0 || r1 == 7)) {
                      ChessCellPiece('Q', mover.isLight)
                  } else mover
                  nextGrid[r0][c0] = null
                  return !kingThreatened(nextGrid, mover.isLight)
              }

              fun kingThreatened(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Boolean {
                  var kR = -1
                  var kC = -1
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c]
                          if (p != null && p.isLight == lightSide && p.kind == 'K') {
                              kR = r
                              kC = c
                          }
                      }
                  }
                  if (kR == -1) return true
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val enemy = grid[r][c]
                          if (enemy != null && enemy.isLight != lightSide) {
                              if (canReach(grid, r, c, kR, kC, ignoreCheck = true)) return true
                          }
                      }
                  }
                  return false
              }

              fun validTargetsFor(grid: Array<Array<ChessCellPiece?>>, r0: Int, c0: Int): List<Pair<Int, Int>> {
                  val res = mutableListOf<Pair<Int, Int>>()
                  for (r in 0..7) {
                      for (c in 0..7) {
                          if (canReach(grid, r0, c0, r, c)) res.add(Pair(r, c))
                      }
                  }
                  return res
              }

              fun hasAnyLegalMove(grid: Array<Array<ChessCellPiece?>>, lightSide: Boolean): Boolean {
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val p = grid[r][c]
                          if (p != null && p.isLight == lightSide) {
                              if (validTargetsFor(grid, r, c).isNotEmpty()) return true
                          }
                      }
                  }
                  return false
              }
          }

          object NetworkAddressHelper {
              fun detectLanIp(): String {
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      while (interfaces.hasMoreElements()) {
                          val nif = interfaces.nextElement()
                          if (!nif.isUp || nif.isLoopback) continue
                          val addrs = nif.inetAddresses
                          while (addrs.hasMoreElements()) {
                              val addr = addrs.nextElement()
                              if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                  return addr.hostAddress ?: "127.0.0.1"
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return "192.168.43.1"
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Color(0xFFD4AF37),
                              secondary = Color(0xFF38BDF8),
                              background = Color(0xFF0B0E17),
                              surface = Color(0xFF151B2B)
                          )
                      ) {
                          MultiChessAppScreen()
                      }
                  }
              }
          }

          @Composable
          fun MultiChessAppScreen() {
              val scope = rememberCoroutineScope()
              var activeTab by remember { mutableStateOf(0) } // 0 = Host, 1 = Play
              var localIp by remember { mutableStateOf(NetworkAddressHelper.detectLanIp()) }

              // Host state
              var hostRoomTitle by remember { mutableStateOf("Grandmaster Table") }
              var isHostingRoom by remember { mutableStateOf(false) }
              var statusBanner by remember { mutableStateOf("Select HOST to create a table or PLAY to join available LAN games.") }

              // Play discovery state
              val availableMatches = remember { mutableStateListOf<HostedMatchInfo>() }
              var manualHostIp by remember { mutableStateOf("") }

              // Active match state
              var matchConnected by remember { mutableStateOf(false) }
              var localPlaysLight by remember { mutableStateOf(true) }
              var lightTurnNow by remember { mutableStateOf(true) }
              var boardState by remember { mutableStateOf(LanChessRules.freshGrid()) }
              var pickedSquare by remember { mutableStateOf<Pair<Int, Int>?>(null) }
              var legalMoves by remember { mutableStateOf<List<Pair<Int, Int>>>(emptyList()) }
              var tiltDegrees by remember { mutableStateOf(26f) }
              var peerHeadline by remember { mutableStateOf("Waiting for opponent...") }

              // Networking references
              var tcpServerRef by remember { mutableStateOf<ServerSocket?>(null) }
              var activeSocketRef by remember { mutableStateOf<Socket?>(null) }
              var socketWriterRef by remember { mutableStateOf<PrintWriter?>(null) }
              var beaconJobRef by remember { mutableStateOf<Job?>(null) }

              fun disconnectSession() {
                  beaconJobRef?.cancel()
                  try { activeSocketRef?.close() } catch (_: Exception) {}
                  try { tcpServerRef?.close() } catch (_: Exception) {}
                  activeSocketRef = null
                  tcpServerRef = null
                  socketWriterRef = null
                  isHostingRoom = false
                  matchConnected = false
                  pickedSquare = null
                  legalMoves = emptyList()
              }

              fun handleIncomingPacket(line: String) {
                  val parts = line.trim().split(":")
                  if (parts.isEmpty()) return
                  when (parts[0]) {
                      "MOVE" -> if (parts.size >= 5) {
                          val r0 = parts[1].toIntOrNull() ?: return
                          val c0 = parts[2].toIntOrNull() ?: return
                          val r1 = parts[3].toIntOrNull() ?: return
                          val c1 = parts[4].toIntOrNull() ?: return
                          val updated = LanChessRules.cloneGrid(boardState)
                          val moving = updated[r0][c0] ?: return
                          updated[r1][c1] = if (moving.kind == 'P' && (r1 == 0 || r1 == 7)) {
                              ChessCellPiece('Q', moving.isLight)
                          } else moving
                          updated[r0][c0] = null
                          boardState = updated
                          lightTurnNow = !lightTurnNow
                          pickedSquare = null
                          legalMoves = emptyList()
                      }
                      "RESET" -> {
                          boardState = LanChessRules.freshGrid()
                          lightTurnNow = true
                          pickedSquare = null
                          legalMoves = emptyList()
                          statusBanner = "Match table reset! White moves first."
                      }
                  }
              }

              fun bindSocketStream(sock: Socket, amHost: Boolean, title: String) {
                  scope.launch(Dispatchers.IO) {
                      try {
                          val writer = PrintWriter(sock.getOutputStream(), true)
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream()))
                          withContext(Dispatchers.Main) {
                              activeSocketRef = sock
                              socketWriterRef = writer
                              localPlaysLight = amHost
                              lightTurnNow = true
                              boardState = LanChessRules.freshGrid()
                              matchConnected = true
                              peerHeadline = if (amHost) {
                                  "Hosting \"$title\" • Playing as White"
                              } else {
                                  "Checked into \"$title\" • Playing as Black"
                              }
                              statusBanner = "Connected over LAN! White moves first."
                          }
                          while (sock.isConnected && !sock.isClosed) {
                              val incoming = reader.readLine() ?: break
                              withContext(Dispatchers.Main) {
                                  handleIncomingPacket(incoming)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          withContext(Dispatchers.Main) {
                              if (matchConnected || isHostingRoom) {
                                  disconnectSession()
                                  statusBanner = "Opponent disconnected from table."
                              }
                          }
                      }
                  }
              }

              fun startHostingTable() {
                  disconnectSession()
                  localIp = NetworkAddressHelper.detectLanIp()
                  val cleanTitle = hostRoomTitle.trim().ifEmpty { "Multi Chess Room" }.replace("|", " ")
                  isHostingRoom = true
                  statusBanner = "Broadcasting \"$cleanTitle\" on $localIp:45455 — waiting for challenger..."

                  beaconJobRef = scope.launch(Dispatchers.IO) {
                      var udpSock: DatagramSocket? = null
                      try {
                          udpSock = DatagramSocket()
                          udpSock.broadcast = true
                          while (isActive && isHostingRoom && !matchConnected) {
                              val payload = "MULTICHESS|$cleanTitle|$localIp|45455".toByteArray()
                              val pkt = DatagramPacket(
                                  payload,
                                  payload.size,
                                  InetAddress.getByName("255.255.255.255"),
                                  45454
                              )
                              try { udpSock.send(pkt) } catch (_: Exception) {}
                              delay(1200)
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { udpSock?.close() } catch (_: Exception) {}
                      }
                  }

                  scope.launch(Dispatchers.IO) {
                      try {
                          val server = ServerSocket(45455)
                          tcpServerRef = server
                          val client = server.accept()
                          beaconJobRef?.cancel()
                          bindSocketStream(client, amHost = true, title = cleanTitle)
                      } catch (_: Exception) {
                          withContext(Dispatchers.Main) {
                              if (!matchConnected) {
                                  isHostingRoom = false
                              }
                          }
                      }
                  }
              }

              fun joinHostedTable(targetIp: String, targetPort: Int, roomTitle: String) {
                  disconnectSession()
                  statusBanner = "Checking into $roomTitle ($targetIp:$targetPort)..."
                  scope.launch(Dispatchers.IO) {
                      try {
                          val sock = Socket()
                          sock.connect(InetSocketAddress(targetIp.trim(), targetPort), 4000)
                          bindSocketStream(sock, amHost = false, title = roomTitle)
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              statusBanner = "Could not connect to $targetIp:$targetPort (${e.localizedMessage ?: "unreachable"})"
                          }
                      }
                  }
              }

              // Background UDP Listener for available games on the Play tab
              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      var listenSock: DatagramSocket? = null
                      try {
                          listenSock = DatagramSocket(null)
                          listenSock.reuseAddress = true
                          listenSock.bind(InetSocketAddress(45454))
                          listenSock.soTimeout = 2500
                          val buf = ByteArray(512)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  listenSock.receive(pkt)
                                  val msg = String(pkt.data, 0, pkt.length)
                                  if (msg.startsWith("MULTICHESS|")) {
                                      val segs = msg.split("|")
                                      if (segs.size >= 4) {
                                          val rName = segs[1]
                                          val rIp = pkt.address?.hostAddress ?: segs[2]
                                          val rPort = segs[3].toIntOrNull() ?: 45455
                                          val now = System.currentTimeMillis()
                                          withContext(Dispatchers.Main) {
                                              val idx = availableMatches.indexOfFirst { it.hostAddress == rIp }
                                              val entry = HostedMatchInfo(rName, rIp, rPort, now)
                                              if (idx >= 0) availableMatches[idx] = entry
                                              else availableMatches.add(entry)
                                          }
                                      }
                                  }
                              } catch (_: SocketTimeoutException) {}
                              val cutoff = System.currentTimeMillis() - 6000
                              withContext(Dispatchers.Main) {
                                  availableMatches.removeAll { it.lastBeaconMs < cutoff }
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { listenSock?.close() } catch (_: Exception) {}
                      }
                  }
              }

              val bgBrush = Brush.verticalGradient(
                  colors = listOf(Color(0xFF090C14), Color(0xFF121829), Color(0xFF0A0D16))
              )

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(bgBrush)
                      .padding(horizontal = 16.dp, vertical = 12.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  // Sleek Top Header
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(bottom = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              modifier = Modifier
                                  .size(40.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(Color(0xFF0A0B0E))
                                  .border(1.5.dp, Color(0xFFD4AF37), RoundedCornerShape(12.dp)),
                              contentAlignment = Alignment.Center
                          ) {
                              Text("♚", fontSize = 24.sp, color = Color(0xFFD4AF37))
                          }
                          Spacer(modifier = Modifier.width(10.dp))
                          Column {
                              Text(
                                  "MULTI CHESS",
                                  color = Color.White,
                                  fontWeight = FontWeight.ExtraBold,
                                  fontSize = 18.sp,
                                  letterSpacing = 1.4.sp
                              )
                              Text(
                                  "LAN 3D VERTICAL TABLE • $localIp",
                                  color = Color(0xFF94A3B8),
                                  fontSize = 11.sp
                              )
                          }
                      }

                      if (matchConnected) {
                          TextButton(
                              onClick = {
                                  disconnectSession()
                                  statusBanner = "Left active chess table."
                              }
                          ) {
                              Text("Exit Table", color = Color(0xFFF87171), fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  // Segmented HOST and PLAY Tabs
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(14.dp))
                          .background(Color(0xFF171F32))
                          .border(1.dp, Color(0xFF283552), RoundedCornerShape(14.dp))
                          .padding(4.dp)
                  ) {
                      val tabs = listOf("HOST" to "Host Games", "PLAY" to "Play Hosted Games")
                      tabs.forEachIndexed { idx, pair ->
                          val selected = activeTab == idx
                          Box(
                              modifier = Modifier
                                  .weight(1f)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(
                                      if (selected) Brush.horizontalGradient(
                                          listOf(Color(0xFFD4AF37), Color(0xFFB5891C))
                                      ) else Brush.horizontalGradient(
                                          listOf(Color.Transparent, Color.Transparent)
                                      )
                                  )
                                  .clickable { activeTab = idx }
                                  .padding(vertical = 10.dp),
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(
                                      pair.first,
                                      color = if (selected) Color(0xFF090C14) else Color.White,
                                      fontWeight = FontWeight.ExtraBold,
                                      fontSize = 13.sp
                                  )
                                  Text(
                                      pair.second,
                                      color = if (selected) Color(0xFF1E293B) else Color(0xFF94A3B8),
                                      fontSize = 10.sp
                                  )
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  //Lobby Controls when not in an active match
                  if (!matchConnected) {
                      if (activeTab == 0) {
                          // HOST TAB CARD
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .border(1.dp, Color(0xFF2B3958), RoundedCornerShape(16.dp)),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF131A2B)),
                              shape = RoundedCornerShape(16.dp)
                          ) {
                              Column(modifier = Modifier.padding(14.dp)) {
                                  Text(
                                      "HOST A NEW LAN CHESS TABLE",
                                      color = Color(0xFFD4AF37),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 12.sp
                                  )
                                  Spacer(modifier = Modifier.height(8.dp))
                                  OutlinedTextField(
                                      value = hostRoomTitle,
                                      onValueChange = { hostRoomTitle = it },
                                      label = { Text("Table Name") },
                                      singleLine = true,
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  Spacer(modifier = Modifier.height(10.dp))
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          "Host IP: $localIp:45455",
                                          color = Color(0xFF38BDF8),
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                      Button(
                                          onClick = {
                                              if (isHostingRoom) {
                                                  disconnectSession()
                                                  statusBanner = "Stopped hosting table."
                                              } else {
                                                  startHostingTable()
                                              }
                                          },
                                          colors = ButtonDefaults.buttonColors(
                                              containerColor = if (isHostingRoom) Color(0xFFEF4444) else Color(0xFFD4AF37),
                                              contentColor = Color(0xFF090C14)
                                          )
                                      ) {
                                          Icon(
                                              if (isHostingRoom) Icons.Default.Refresh else Icons.Default.Add,
                                              contentDescription = null
                                          )
                                          Spacer(modifier = Modifier.width(6.dp))
                                          Text(
                                              if (isHostingRoom) "Stop Hosting" else "Start Hosting",
                                              fontWeight = FontWeight.Bold
                                          )
                                      }
                                  }
                              }
                          }
                      } else {
                          // PLAY TAB CARD (Check into available LAN games)
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .border(1.dp, Color(0xFF2B3958), RoundedCornerShape(16.dp)),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF131A2B)),
                              shape = RoundedCornerShape(16.dp)
                          ) {
                              Column(modifier = Modifier.padding(14.dp)) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          "AVAILABLE LAN GAMES (${availableMatches.size})",
                                          color = Color(0xFF38BDF8),
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 12.sp
                                      )
                                      Icon(
                                          Icons.Default.Wifi,
                                          contentDescription = null,
                                          tint = Color(0xFFD4AF37),
                                          modifier = Modifier.size(18.dp)
                                      )
                                  }
                                  Spacer(modifier = Modifier.height(6.dp))
                                  if (availableMatches.isEmpty()) {
                                      Text(
                                          "Scanning Wi-Fi / Hotspot for hosted Multi Chess tables...",
                                          color = Color(0xFF94A3B8),
                                          fontSize = 12.sp
                                      )
                                  } else {
                                      LazyColumn(modifier = Modifier.heightIn(max = 110.dp)) {
                                          items(availableMatches) { item ->
                                              Row(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(vertical = 4.dp)
                                                      .clip(RoundedCornerShape(10.dp))
                                                      .background(Color(0xFF1E293B))
                                                      .padding(horizontal = 12.dp, vertical = 8.dp),
                                                  horizontalArrangement = Arrangement.SpaceBetween,
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  Column {
                                                      Text(
                                                          item.roomTitle,
                                                          color = Color.White,
                                                          fontWeight = FontWeight.Bold,
                                                          fontSize = 13.sp
                                                      )
                                                      Text(
                                                          "${item.hostAddress}:${item.tcpPort}",
                                                          color = Color(0xFF94A3B8),
                                                          fontSize = 11.sp
                                                      )
                                                  }
                                                  Button(
                                                      onClick = {
                                                          joinHostedTable(
                                                              item.hostAddress,
                                                              item.tcpPort,
                                                              item.roomTitle
                                                          )
                                                      },
                                                      colors = ButtonDefaults.buttonColors(
                                                          containerColor = Color(0xFF38BDF8),
                                                          contentColor = Color(0xFF090C14)
                                                      ),
                                                      contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp)
                                                  ) {
                                                      Icon(Icons.Default.PlayArrow, contentDescription = null)
                                                      Spacer(modifier = Modifier.width(4.dp))
                                                      Text("Check In", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      OutlinedTextField(
                                          value = manualHostIp,
                                          onValueChange = { manualHostIp = it },
                                          label = { Text("Direct Host IP (optional)") },
                                          singleLine = true,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Button(
                                          onClick = {
                                              if (manualHostIp.isNotBlank()) {
                                                  joinHostedTable(manualHostIp, 45455, "Direct Table")
                                              }
                                          },
                                          colors = ButtonDefaults.buttonColors(
                                              containerColor = Color(0xFFD4AF37),
                                              contentColor = Color(0xFF090C14)
                                          )
                                      ) {
                                          Text("Join IP", fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                  }

                  // Status & 3D Tilt Bar
                  val inCheck = LanChessRules.kingThreatened(boardState, lightTurnNow)
                  val hasMoves = LanChessRules.hasAnyLegalMove(boardState, lightTurnNow)
                  val turnDesc = when {
                      !hasMoves && inCheck -> if (lightTurnNow) "CHECKMATE • Black Wins!" else "CHECKMATE • White Wins!"
                      !hasMoves -> "STALEMATE • Draw Game!"
                      inCheck -> if (lightTurnNow) "WHITE IN CHECK!" else "BLACK IN CHECK!"
                      else -> if (lightTurnNow) "White's Turn to Move" else "Black's Turn to Move"
                  }

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(12.dp))
                          .background(Color(0xFF151D30))
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              if (matchConnected) peerHeadline else statusBanner,
                              color = Color(0xFFE2E8F0),
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Medium
                          )
                          Text(
                              turnDesc,
                              color = if (inCheck) Color(0xFFF87171) else Color(0xFFD4AF37),
                              fontSize = 13.sp,
                              fontWeight = FontWeight.ExtraBold
                          )
                      }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          TextButton(
                              onClick = { tiltDegrees = if (tiltDegrees > 10f) 0f else 26f }
                          ) {
                              Text(
                                  if (tiltDegrees > 10f) "3D View" else "2D View",
                                  color = Color(0xFF38BDF8),
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 12.sp
                              )
                          }
                          TextButton(
                              onClick = {
                                  boardState = LanChessRules.freshGrid()
                                  lightTurnNow = true
                                  pickedSquare = null
                                  legalMoves = emptyList()
                                  scope.launch(Dispatchers.IO) {
                                      try { socketWriterRef?.println("RESET") } catch (_: Exception) {}
                                  }
                              }
                          ) {
                              Text("Reset", color = Color(0xFFD4AF37), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  // VERTICAL 3D CHESS TABLE
                  val animatedPitch by animateFloatAsState(targetValue = tiltDegrees, label = "pitch3d")
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      contentAlignment = Alignment.Center
                  ) {
                      Vertical3DChessTable(
                          grid = boardState,
                          perspectiveLight = if (matchConnected) localPlaysLight else true,
                          pitchAngle = animatedPitch,
                          selectedCell = pickedSquare,
                          highlightedCells = legalMoves,
                          onSquareTapped = { r, c ->
                              // Allow local test play before opponent connects, or strict turn lock when connected
                              val canControlTurn = !matchConnected || (lightTurnNow == localPlaysLight)
                              if (!canControlTurn) return@Vertical3DChessTable

                              val currentPick = pickedSquare
                              if (currentPick != null && legalMoves.contains(Pair(r, c))) {
                                  val r0 = currentPick.first
                                  val c0 = currentPick.second
                                  val next = LanChessRules.cloneGrid(boardState)
                                  val moving = next[r0][c0]
                                  if (moving != null) {
                                      next[r][c] = if (moving.kind == 'P' && (r == 0 || r == 7)) {
                                          ChessCellPiece('Q', moving.isLight)
                                      } else moving
                                      next[r0][c0] = null
                                      boardState = next
                                      lightTurnNow = !lightTurnNow
                                      pickedSquare = null
                                      legalMoves = emptyList()
                                      if (matchConnected) {
                                          scope.launch(Dispatchers.IO) {
                                              try {
                                                  socketWriterRef?.println("MOVE:$r0:$c0:$r:$c")
                                              } catch (_: Exception) {}
                                          }
                                      }
                                  }
                              } else {
                                  val tappedPiece = boardState[r][c]
                                  if (tappedPiece != null && tappedPiece.isLight == lightTurnNow) {
                                      pickedSquare = Pair(r, c)
                                      legalMoves = LanChessRules.validTargetsFor(boardState, r, c)
                                  } else {
                                      pickedSquare = null
                                      legalMoves = emptyList()
                                  }
                              }
                          }
                      )
                  }
              }
          }

          @Composable
          fun Vertical3DChessTable(
              grid: Array<Array<ChessCellPiece?>>,
              perspectiveLight: Boolean,
              pitchAngle: Float,
              selectedCell: Pair<Int, Int>?,
              highlightedCells: List<Pair<Int, Int>>,
              onSquareTapped: (Int, Int) -> Unit
          ) {
              val paintPiece = remember {
                  android.graphics.Paint().apply {
                      isAntiAlias = true
                      textAlign = android.graphics.Paint.Align.CENTER
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .fillMaxHeight(0.95f)
                      .padding(horizontal = 6.dp, vertical = 8.dp)
                      .graphicsLayer {
                          rotationX = pitchAngle
                          cameraDistance = 18f * density
                      }
                      .shadow(24.dp, RoundedCornerShape(20.dp))
                      .clip(RoundedCornerShape(20.dp))
                      .background(
                          Brush.verticalGradient(
                              listOf(Color(0xFF2C221E), Color(0xFF1A1310), Color(0xFF0E0A08))
                          )
                      )
                      .border(2.5.dp, Color(0xFFD4AF37), RoundedCornerShape(20.dp))
                      .padding(12.dp)
              ) {
                  Canvas(
                      modifier = Modifier
                          .fillMaxSize()
                          .pointerInput(perspectiveLight) {
                              detectTapGestures { tapOffset ->
                                  val cellW = size.width / 8f
                                  val cellH = size.height / 8f
                                  val visCol = (tapOffset.x / cellW).toInt().coerceIn(0, 7)
                                  val visRow = (tapOffset.y / cellH).toInt().coerceIn(0, 7)
                                  val boardRow = if (perspectiveLight) visRow else 7 - visRow
                                  val boardCol = if (perspectiveLight) visCol else 7 - visCol
                                  onSquareTapped(boardRow, boardCol)
                              }
                          }
                  ) {
                      val cellW = size.width / 8f
                      val cellH = size.height / 8f
                      val depthLedge = 14.dp.toPx()

                      // 3D Front Bevel Ledge of the Vertical Table
                      drawRoundRect(
                          color = Color(0xFF3E2F1C),
                          topLeft = Offset(0f, size.height - depthLedge / 2f),
                          size = Size(size.width, depthLedge),
                          cornerRadius = CornerRadius(8f, 8f)
                      )

                      for (visR in 0..7) {
                          for (visC in 0..7) {
                              val r = if (perspectiveLight) visR else 7 - visR
                              val c = if (perspectiveLight) visC else 7 - visC
                              val left = visC * cellW
                              val top = visR * cellH
                              val isLightSq = (r + c) % 2 == 0

                              // 3D recessed tile shadow + vertical marble surface
                              val sqBaseColor = if (isLightSq) Color(0xFFE8DFCA) else Color(0xFF3A4B63)
                              val sqSideBevel = if (isLightSq) Color(0xFFC7B99B) else Color(0xFF243042)

                              drawRect(
                                  color = sqSideBevel,
                                  topLeft = Offset(left, top),
                                  size = Size(cellW, cellH)
                              )
                              drawRect(
                                  color = sqBaseColor,
                                  topLeft = Offset(left + 1.5f, top + 1.5f),
                                  size = Size(cellW - 3f, cellH - 4.5f)
                              )

                              // Highlight Selected Square
                              if (selectedCell?.first == r && selectedCell.second == c) {
                                  drawRect(
                                      color = Color(0x88D4AF37),
                                      topLeft = Offset(left, top),
                                      size = Size(cellW, cellH)
                                  )
                                  drawRect(
                                      color = Color(0xFFD4AF37),
                                      topLeft = Offset(left + 2f, top + 2f),
                                      size = Size(cellW - 4f, cellH - 4f),
                                      style = Stroke(width = 4f)
                                  )
                              }

                              // Highlight Legal Destination Squares
                              if (highlightedCells.contains(Pair(r, c))) {
                                  val cx = left + cellW / 2f
                                  val cy = top + cellH / 2f
                                  if (grid[r][c] != null) {
                                      drawCircle(
                                          color = Color(0xCCEF4444),
                                          radius = minOf(cellW, cellH) * 0.42f,
                                          center = Offset(cx, cy),
                                          style = Stroke(width = 5f)
                                      )
                                  } else {
                                      drawCircle(
                                          color = Color(0xCC38BDF8),
                                          radius = minOf(cellW, cellH) * 0.18f,
                                          center = Offset(cx, cy)
                                      )
                                  }
                              }

                              // Render 3D Elevated Pedestal + Chess Piece
                              val piece = grid[r][c]
                              if (piece != null) {
                                  val cx = left + cellW / 2f
                                  val cy = top + cellH / 2f
                                  val pedRadius = minOf(cellW, cellH) * 0.36f

                                  // Drop Shadow on Table
                                  drawCircle(
                                      color = Color(0x77000000),
                                      radius = pedRadius,
                                      center = Offset(cx + 3f, cy + 7f)
                                  )

                                  // 3D Cylinder Side Extrusion
                                  drawCircle(
                                      color = if (piece.isLight) Color(0xFFB8A98A) else Color(0xFF05070B),
                                      radius = pedRadius,
                                      center = Offset(cx, cy + 3.5f)
                                  )

                                  // 3D Pedestal Top Crown
                                  drawCircle(
                                      color = if (piece.isLight) Color(0xFFFDFBF7) else Color(0xFF141824),
                                      radius = pedRadius,
                                      center = Offset(cx, cy - 2f)
                                  )
                                  drawCircle(
                                      color = if (piece.isLight) Color(0xFFD4AF37) else Color(0xFFD4AF37),
                                      radius = pedRadius,
                                      center = Offset(cx, cy - 2f),
                                      style = Stroke(width = 2.2f)
                                  )

                                  // Chess Piece Glyph
                                  paintPiece.textSize = minOf(cellW, cellH) * 0.48f
                                  paintPiece.color = if (piece.isLight) {
                                      android.graphics.Color.parseColor("#1C1917")
                                  } else {
                                      android.graphics.Color.parseColor("#F8FAFC")
                                  }
                                  val textY = cy - 2f - (paintPiece.descent() + paintPiece.ascent()) / 2f
                                  drawContext.canvas.nativeCanvas.drawText(
                                      piece.glyph(),
                                      cx,
                                      textY,
                                      paintPiece
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF_KOTLIN

      - name: Compile Multi Chess Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Multi Chess APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Chess-LAN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
